
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNDERGROUND</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #151719;
  color: white;
  font-family: Arial, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
}

canvas { display: block; }

#overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.48);
}

#panel {
  width: min(90%, 440px);
  padding: 36px 30px;
  text-align: center;
  background: #171a20;
  border: 1px solid #ffffff33;
  border-radius: 10px;
  box-shadow: 0 15px 60px #0008;
}

#panel h1 {
  margin: 0 0 15px;
  font-size: 34px;
  letter-spacing: 5px;
}

#panel p {
  color: #bbb;
  font-size: 14px;
  line-height: 1.9;
}

#enterText {
  margin-top: 25px;
  padding: 13px;
  border: 1px solid #ffffff55;
  border-radius: 5px;
  letter-spacing: 3px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  50% { opacity: .4; }
}

#hud {
  position: fixed;
  z-index: 2;
  top: 18px;
  left: 20px;
  color: #ffffffbb;
  font-size: 13px;
  line-height: 1.8;
  text-shadow: 0 1px 5px black;
  pointer-events: none;
}

#crosshair {
  position: fixed;
  z-index: 3;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: white;
  transform: translate(-50%, -50%);
  display: none;
  pointer-events: none;
}

#error {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  align-items: center;
  justify-content: center;
  background: #171a20;
  color: #ffaaaa;
  padding: 25px;
  text-align: center;
  font-family: monospace;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  UNDERGROUND<br>
  WASD : MOVE
</div>

<div id="crosshair"></div>

<div id="overlay">
  <div id="panel">
    <h1>UNDERGROUND</h1>

    <p id="description">
      どこまでも続く地下通路。<br>
      周囲を観察しながら進もう。
    </p>

    <p>
      W : 前進<br>
      S : 後退<br>
      A / D : 左右移動<br>
      MOUSE : 視点移動
    </p>

    <div id="enterText">PRESS ENTER</div>
  </div>
</div>

<div id="error">
  <div id="errorText"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {

  // ==========================================
  // 1. HTML elements
  // ==========================================

  const container = document.getElementById("game");
  const overlay = document.getElementById("overlay");
  const description = document.getElementById("description");
  const enterText = document.getElementById("enterText");
  const crosshair = document.getElementById("crosshair");
  const errorScreen = document.getElementById("error");
  const errorText = document.getElementById("errorText");

  if (typeof THREE === "undefined") {
    errorScreen.style.display = "flex";
    errorText.textContent = "THREE.JS LOAD ERROR";
    return;
  }

  // ==========================================
  // 2. Scene
  // ==========================================

  const scene = new THREE.Scene();

  scene.background = new THREE.Color(0x777b7e);
  scene.fog = new THREE.Fog(0x777b7e, 20, 75);

  const camera = new THREE.PerspectiveCamera(
    72,
    window.innerWidth / window.innerHeight,
    0.1,
    150
  );

  camera.position.set(0, 1.65, 15);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 1.75)
  );

  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  container.appendChild(renderer.domElement);

  // ==========================================
  // 3. Seeded random
  // ==========================================

  function makeRandom(seed) {
    let value = seed >>> 0;

    return function() {
      value = (value * 1664525 + 1013904223) >>> 0;
      return value / 4294967296;
    };
  }

  // ==========================================
  // 4. Canvas texture helpers
  // ==========================================

  function makeCanvasTexture(canvas, isColor = false) {

    const texture = new THREE.CanvasTexture(canvas);

    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.anisotropy =
      renderer.capabilities.getMaxAnisotropy();

    if (isColor) {
      texture.encoding = THREE.sRGBEncoding;
    }

    return texture;
  }

  function makeNormalMap(heightCanvas, strength = 2.5) {

    const source = heightCanvas.getContext("2d");
    const width = heightCanvas.width;
    const height = heightCanvas.height;

    const image = source.getImageData(
      0, 0, width, height
    );

    const output = document.createElement("canvas");
    output.width = width;
    output.height = height;

    const ctx = output.getContext("2d");
    const result = ctx.createImageData(width, height);

    function sample(x, y) {
      x = (x + width) % width;
      y = (y + height) % height;

      return image.data[(y * width + x) * 4];
    }

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {

        const left = sample(x - 1, y);
        const right = sample(x + 1, y);
        const up = sample(x, y - 1);
        const down = sample(x, y + 1);

        const dx = (right - left) / 255;
        const dy = (down - up) / 255;

        let nx = -dx * strength;
        let ny = -dy * strength;
        let nz = 1;

        const length = Math.sqrt(
          nx * nx + ny * ny + nz * nz
        );

        nx /= length;
        ny /= length;
        nz /= length;

        const index = (y * width + x) * 4;

        result.data[index] = (nx * 0.5 + 0.5) * 255;
        result.data[index + 1] = (ny * 0.5 + 0.5) * 255;
        result.data[index + 2] = (nz * 0.5 + 0.5) * 255;
        result.data[index + 3] = 255;
      }
    }

    ctx.putImageData(result, 0, 0);

    return makeCanvasTexture(output);
  }

  // ==========================================
  // 5. Procedural tile materials
  // ==========================================

  function createTileSet(options) {

    const width = 512;
    const height = 512;

    const columns = options.columns || 4;
    const rows = options.rows || 4;

    const cellW = width / columns;
    const cellH = height / rows;

    const colorCanvas = document.createElement("canvas");
    const heightCanvas = document.createElement("canvas");
    const roughCanvas = document.createElement("canvas");

    colorCanvas.width = heightCanvas.width = roughCanvas.width = width;
    colorCanvas.height = heightCanvas.height = roughCanvas.height = height;

    const c = colorCanvas.getContext("2d");
    const h = heightCanvas.getContext("2d");
    const r = roughCanvas.getContext("2d");

    const rand = makeRandom(options.seed || 1);

    c.fillStyle = options.grout;
    c.fillRect(0, 0, width, height);

    h.fillStyle = "#55";
    h.fillRect(0, 0, width, height);

    r.fillStyle = "#c0c0c0";
    r.fillRect(0, 0, width, height);

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < columns; col++) {

        const x = col * cellW;
        const y = row * cellH;

        const inset = options.inset || 5;

        const red = Math.max(
          0, Math.min(255, options.base[0] + Math.floor(rand() * 13) - 6)
        );

        const green = Math.max(
          0, Math.min(255, options.base[1] + Math.floor(rand() * 13) - 6)
        );

        const blue = Math.max(
          0, Math.min(255, options.base[2] + Math.floor(rand() * 13) - 6)
        );

        const tileW = cellW - inset * 2;
        const tileH = cellH - inset * 2;

        // Base tile
        c.fillStyle = `rgb(${red},${green},${blue})`;
        c.fillRect(x + inset, y + inset, tileW, tileH);

        // Light gradient
        const gradient = c.createLinearGradient(
          x + inset,
          y + inset,
          x + cellW,
          y + cellH
        );

        gradient.addColorStop(0, "#ffffff20");
        gradient.addColorStop(0.55, "#ffffff00");
        gradient.addColorStop(1, "#00000020");

        c.fillStyle = gradient;
        c.fillRect(x + inset, y + inset, tileW, tileH);

        // Random surface noise
        for (let i = 0; i < 95; i++) {

          const px = x + inset + rand() * tileW;
          const py = y + inset + rand() * tileH;

          const size = rand() * 1.8 + 0.3;

          c.fillStyle = rand() > 0.5
            ? "rgba(30,30,30,0.045)"
            : "rgba(255,255,255,0.05)";

          c.fillRect(px, py, size, size);
        }

        // Tile height and beveled edges
        h.fillStyle = "#505050";
        h.fillRect(x, y, cellW, cellH);

        h.fillStyle = "#999999";
        h.fillRect(
          x + inset,
          y + inset,
          tileW,
          tileH
        );

        h.fillStyle = "#c0c0c0";
        h.fillRect(
          x + inset + 4,
          y + inset + 4,
          tileW - 8,
          tileH - 8
        );

        h.fillStyle = "#a0a0a0";
        h.fillRect(
          x + inset + 8,
          y + inset + 8,
          tileW - 16,
          tileH - 16
        );

        // Roughness
        const rough = Math.floor(165 + rand() * 55);

        r.fillStyle = `rgb(${rough},${rough},${rough})`;
        r.fillRect(
          x + inset,
          y + inset,
          tileW,
          tileH
        );
      }
    }

    // Dirt speckles
    if (options.dirt) {

      for (let i = 0; i < 300; i++) {

        const x = rand() * width;
        const y = rand() * height;
        const radius = rand() * 3 + 0.4;

        c.fillStyle = `rgba(35,32,27,${rand() * 0.1})`;
        c.beginPath();
        c.arc(x, y, radius, 0, Math.PI * 2);
        c.fill();
      }
    }

    return {
      map: makeCanvasTexture(colorCanvas, true),
      normalMap: makeNormalMap(heightCanvas, 2.4),
      roughnessMap: makeCanvasTexture(roughCanvas)
    };
  }

  const wallSet = createTileSet({
    base: [211, 210, 202],
    grout: "#989994",
    columns: 4,
    rows: 8,
    inset: 4,
    seed: 125,
    dirt: true
  });

  const floorSet = createTileSet({
    base: [111, 113, 114],
    grout: "#55585a",
    columns: 4,
    rows: 4,
    inset: 5,
    seed: 312,
    dirt: true
  });

  const ceilingSet = createTileSet({
    base: [188, 187, 179],
    grout: "#aaa9a3",
    columns: 4,
    rows: 4,
    inset: 4,
    seed: 817,
    dirt: false
  });

  // ==========================================
  // 6. Materials
  // ==========================================

  function surfaceMaterial(set, roughness, bumpScale, metalness = 0) {

    return new THREE.MeshStandardMaterial({
      map: set.map,
      normalMap: set.normalMap,
      normalScale: new THREE.Vector2(0.45, 0.45),
      roughnessMap: set.roughnessMap,
      roughness,
      metalness,
      bumpMap: set.normalMap,
      bumpScale,
      side: THREE.DoubleSide
    });
  }

  const wallMat = surfaceMaterial(
    wallSet, 0.83, 0.018
  );

  const floorMat = surfaceMaterial(
    floorSet, 0.78, 0.025, 0.025
  );

  const ceilingMat = surfaceMaterial(
    ceilingSet, 0.95, 0.012
  );

  const simple = (color, roughness = 0.85, metalness = 0) =>
    new THREE.MeshStandardMaterial({
      color,
      roughness,
      metalness
    });

  const darkMetal = simple(0x424548, 0.65, 0.4);
  const metal = simple(0x929493, 0.42, 0.45);
  const doorMaterial = simple(0x777b7b, 0.76);
  const yellow = simple(0xd7b83e, 0.78);
  const white = simple(0xe9e7df, 0.8);
  const black = simple(0x25282a, 0.8);

  const lampMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xfff3dc,
    emissiveIntensity: 2.3,
    roughness: 0.3
  });

  // ==========================================
  // 7. Lighting
  // ==========================================

  scene.add(
    new THREE.AmbientLight(0xffffff, 0.34)
  );

  scene.add(
    new THREE.HemisphereLight(
      0xe9efff,
      0x514d49,
      0.5
    )
  );

  const sun = new THREE.DirectionalLight(
    0xffffff,
    0.42
  );

  sun.position.set(-3, 7, 12);
  sun.target.position.set(0, 0, -10);
  sun.castShadow = true;

  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -8;
  sun.shadow.camera.right = 8;
  sun.shadow.camera.top = 9;
  sun.shadow.camera.bottom = -5;
  sun.shadow.camera.near = 0.1;
  sun.shadow.camera.far = 35;
  sun.shadow.bias = -0.0003;

  scene.add(sun);
  scene.add(sun.target);

  // ==========================================
  // 8. Geometry helpers
  // ==========================================

  function box(w, h, d, material, x, y, z, cast = false) {

    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      material
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = cast;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
  }

  function plane(
    w, h, material,
    x, y, z,
    rx = 0, ry = 0
  ) {

    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      material
    );

    mesh.position.set(x, y, z);
    mesh.rotation.set(rx, ry, 0);
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
  }

  function cylinder(
    radius, length, material,
    x, y, z,
    rx = 0, rz = 0
  ) {

    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius, radius, length, 16
      ),
      material
    );

    mesh.position.set(x, y, z);
    mesh.rotation.set(rx, 0, rz);
    mesh.castShadow = true;

    scene.add(mesh);

    return mesh;
  }

  // ==========================================
  // 9. Corridor structure
  // ==========================================

  const W = 8;
  const START = 25;
  const END = -65;
  const LENGTH = START - END;
  const CENTER = (START + END) / 2;

  // Structural floor
  box(W, 0.22, LENGTH, simple(0x65676a), 0, -0.11, CENTER);

  // Structural ceiling
  box(W, 0.22, LENGTH, simple(0xb1b1aa), 0, 3.61, CENTER);

  // Structural walls
  box(0.22, 3.5, LENGTH, simple(0xc8c7c0), -4, 1.65, CENTER);
  box(0.22, 3.5, LENGTH, simple(0xc8c7c0), 4, 1.65, CENTER);

  // End wall
  box(W, 3.5, 0.22, simple(0xc8c7c0), 0, 1.65, END);

  // Floor surface
  const floorTextureMaterial = floorMat.clone();

  floorTextureMaterial.map = floorSet.map.clone();
  floorTextureMaterial.normalMap = floorSet.normalMap.clone();
  floorTextureMaterial.roughnessMap = floorSet.roughnessMap.clone();

  floorTextureMaterial.map.repeat.set(3.33, 37.5);
  floorTextureMaterial.normalMap.repeat.set(3.33, 37.5);
  floorTextureMaterial.roughnessMap.repeat.set(3.33, 37.5);

  plane(
    W, LENGTH,
    floorTextureMaterial,
    0, 0.006, CENTER,
    -Math.PI / 2
  );

  // Ceiling surface
  const ceilingTextureMaterial = ceilingMat.clone();

  ceilingTextureMaterial.map = ceilingSet.map.clone();
  ceilingTextureMaterial.normalMap = ceilingSet.normalMap.clone();
  ceilingTextureMaterial.roughnessMap = ceilingSet.roughnessMap.clone();

  ceilingTextureMaterial.map.repeat.set(3.33, 37.5);
  ceilingTextureMaterial.normalMap.repeat.set(3.33, 37.5);
  ceilingTextureMaterial.roughnessMap.repeat.set(3.33, 37.5);

  plane(
    W, LENGTH,
    ceilingTextureMaterial,
    0, 3.49, CENTER,
    Math.PI / 2
  );

  // Wall surfaces
  const wallLeft = wallMat.clone();

  wallLeft.map = wallSet.map.clone();
  wallLeft.normalMap = wallSet.normalMap.clone();
  wallLeft.roughnessMap = wallSet.roughnessMap.clone();

  wallLeft.map.repeat.set(37.5, 3);
  wallLeft.normalMap.repeat.set(37.5, 3);
  wallLeft.roughnessMap.repeat.set(37.5, 3);

  const wallRight = wallLeft.clone();

  wallRight.map = wallLeft.map.clone();
  wallRight.normalMap = wallLeft.normalMap.clone();
  wallRight.roughnessMap = wallLeft.roughnessMap.clone();

  plane(
    LENGTH, 3.5,
    wallLeft,
    -3.884, 1.75, CENTER,
    0, Math.PI / 2
  );

  plane(
    LENGTH, 3.5,
    wallRight,
    3.884, 1.75, CENTER,
    0, -Math.PI / 2
  );

  // ==========================================
  // 10. Architectural details
  // ==========================================

  // Skirting boards
  for (const side of [-1, 1]) {

    box(
      0.08, 0.18, LENGTH,
      darkMetal,
      side * 3.84, 0.10, CENTER
    );

    box(
      0.07, 0.035, LENGTH,
      metal,
      side * 3.81, 0.22, CENTER
    );

    // Upper wall trim
    box(
      0.07, 0.07, LENGTH,
      white,
      side * 3.83, 3.33, CENTER
    );

    // Long metal ceiling rails
    box(
      0.09, 0.09, LENGTH,
      darkMetal,
      side * 3.45, 3.38, CENTER
    );
  }

  // Ceiling panel seams
  for (let z = START - 1; z > END; z -= 2.4) {

    box(
      7.6, 0.012, 0.018,
      simple(0x999a96),
      0, 3.475, z
    );
  }

  // ==========================================
  // 11. Wall grime
  // ==========================================

  function makeGrimeTexture() {

    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;

    const c = canvas.getContext("2d");
    c.clearRect(0, 0, 256, 256);

    const rand = makeRandom(903);

    for (let i = 0; i < 180; i++) {

      const x = rand() * 256;
      const y = rand() * 256;
      const r = rand() * 18 + 3;

      const g = c.createRadialGradient(
        x, y, 0,
        x, y, r
      );

      g.addColorStop(0, "rgba(45,42,36,0.14)");
      g.addColorStop(1, "rgba(45,42,36,0)");

      c.fillStyle = g;
      c.fillRect(x-r, y-r, r*2, r*2);
    }

    return makeCanvasTexture(canvas, true);
  }

  const grimeTexture = makeGrimeTexture();

  const grimeMaterial = new THREE.MeshBasicMaterial({
    map: grimeTexture,
    transparent: true,
    opacity: 0.75,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  for (let z = 17; z > END + 4; z -= 10) {

    plane(
      1.5, 0.8,
      grimeMaterial,
      -3.87, 0.6, z,
      0, Math.PI / 2
    );

    plane(
      1.3, 0.7,
      grimeMaterial,
      3.87, 0.65, z - 5,
      0, -Math.PI / 2
    );
  }

  // ==========================================
  // 12. Tactile paving
  // ==========================================

  function createTactileSet() {

    const color = document.createElement("canvas");
    const height = document.createElement("canvas");

    color.width = height.width = 256;
    color.height = height.height = 256;

    const c = color.getContext("2d");
    const h = height.getContext("2d");

    c.fillStyle = "#c5a52c";
    c.fillRect(0, 0, 256, 256);

    h.fillStyle = "#777777";
    h.fillRect(0, 0, 256, 256);

    // Grid of raised dots
    for (let y = 20; y < 256; y += 64) {
      for (let x = 20; x < 256; x += 64) {

        const grad = c.createRadialGradient(
          x - 5, y - 5, 2,
          x, y, 15
        );

        grad.addColorStop(0, "#ead05e");
        grad.addColorStop(0.65, "#d6b33b");
        grad.addColorStop(1, "#927723");

        c.fillStyle = grad;
        c.beginPath();
        c.arc(x, y, 13, 0, Math.PI * 2);
        c.fill();

        const hg = h.createRadialGradient(
          x - 5, y - 5, 2,
          x, y, 15
        );

        hg.addColorStop(0, "#f0f0f0");
        hg.addColorStop(0.65, "#bdbdbd");
        hg.addColorStop(1, "#707070");

        h.fillStyle = hg;
        h.beginPath();
        h.arc(x, y, 13, 0, Math.PI * 2);
        h.fill();
      }
    }

    return {
      map: makeCanvasTexture(color, true),
      normalMap: makeNormalMap(height, 1.7)
    };
  }

  const tactileSet = createTactileSet();

  const tactileMaterial = new THREE.MeshStandardMaterial({
    map: tactileSet.map,
    normalMap: tactileSet.normalMap,
    roughness: 0.9,
    side: THREE.DoubleSide
  });

  const tactileA = tactileMaterial.clone();
  tactileA.map = tactileSet.map.clone();
  tactileA.normalMap = tactileSet.normalMap.clone();

  tactileA.map.repeat.set(1, 37.5);
  tactileA.normalMap.repeat.set(1, 37.5);

  const tactileB = tactileMaterial.clone();
  tactileB.map = tactileSet.map.clone();
  tactileB.normalMap = tactileSet.normalMap.clone();

  tactileB.map.repeat.set(1, 37.5);
  tactileB.normalMap.repeat.set(1, 37.5);

  plane(
    0.85, LENGTH,
    tactileA,
    -1.0, 0.035, CENTER,
    -Math.PI / 2
  );

  plane(
    0.85, LENGTH,
    tactileB,
    1.0, 0.035, CENTER,
    -Math.PI / 2
  );

  // ==========================================
  // 13. Pipes and ceiling equipment
  // ==========================================

  for (const x of [-3.25, -2.9, 2.9, 3.25]) {

    cylinder(
      0.045, LENGTH,
      metal,
      x, 3.20, CENTER,
      Math.PI / 2
    );

    // Pipe brackets
    for (let z = START - 3; z > END; z -= 6) {

      box(
        0.08, 0.10, 0.08,
        darkMetal,
        x, 3.15, z
      );
    }
  }

  // Ventilation ducts
  for (let z = START - 9; z > END; z -= 18) {

    box(
      1.0, 0.25, 1.3,
      darkMetal,
      2.5, 3.25, z
    );

    for (let i = 0; i < 7; i++) {

      box(
        0.025, 0.015, 1.1,
        metal,
        2.5 - 0.42 + i * 0.14,
        3.385,
        z
      );
    }
  }

  // ==========================================
  // 14. Fluorescent lights
  // ==========================================

  function createGlowTexture() {

    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 256;

    const c = canvas.getContext("2d");

    const g = c.createRadialGradient(
      128, 128, 5,
      128, 128, 128
    );

    g.addColorStop(0, "rgba(255,238,207,0.26)");
    g.addColorStop(0.4, "rgba(255,238,207,0.10)");
    g.addColorStop(1, "rgba(255,238,207,0)");

    c.fillStyle = g;
    c.fillRect(0, 0, 256, 256);

    return makeCanvasTexture(canvas, true);
  }

  const glowTexture = createGlowTexture();

  const glowMaterial = new THREE.MeshBasicMaterial({
    map: glowTexture,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  });

  function addLamp(z, index) {

    // Metal housing
    box(
      2.5, 0.10, 1.25,
      darkMetal,
      0, 3.38, z
    );

    // Outer frame
    box(
      2.30, 0.04, 1.08,
      metal,
      0, 3.31, z
    );

    // Luminous diffuser
    box(
      2.17, 0.025, 0.95,
      lampMaterial,
      0, 3.285, z
    );

    // Internal lamp tubes
    for (const x of [-0.55, 0.55]) {

      box(
        0.04, 0.015, 0.87,
        white,
        x, 3.26, z
      );
    }

    // Point illumination
    const light = new THREE.PointLight(
      0xffefd8,
      1.25,
      16,
      2
    );

    light.position.set(0, 3.05, z);
    scene.add(light);

    // Light on floor
    const glow = new THREE.Mesh(
      new THREE.PlaneGeometry(6.5, 8),
      glowMaterial
    );

    glow.rotation.x = -Math.PI / 2;
    glow.position.set(0, 0.015, z);
    scene.add(glow);

    return light;
  }

  const lamps = [];

  let lampIndex = 0;

  for (let z = 19; z > END + 4; z -= 9) {
    lamps.push(addLamp(z, lampIndex++));
  }

  // ==========================================
  // 15. Doors
  // ==========================================

  function addDoor(side, z) {

    const x = side * 3.76;

    // Dark recessed area
    box(
      0.09, 2.5, 1.9,
      black,
      x, 1.25, z
    );

    // Outer frame
    box(
      0.12, 2.46, 1.78,
      darkMetal,
      x + side * 0.055, 1.25, z
    );

    // Door surface
    box(
      0.055, 2.27, 1.55,
      doorMaterial,
      x + side * 0.13, 1.17, z
    );

    // Raised door panel
    box(
      0.025, 1.65, 1.25,
      metal,
      x + side * 0.17, 1.28, z
    );

    // Top panel
    box(
      0.025, 0.25, 1.25,
      darkMetal,
      x + side * 0.17, 2.20, z
    );

    // Handle
    box(
      0.04, 0.16, 0.07,
      black,
      x + side * 0.20, 1.15, z - 0.55
    );

    // Handle plate
    box(
      0.025, 0.28, 0.17,
      metal,
      x + side * 0.19, 1.15, z - 0.55
    );

    // Number plate
    box(
      0.025, 0.22, 0.48,
      white,
      x + side * 0.19, 2.05, z
    );

    // Door threshold
    box(
      0.35, 0.05, 1.7,
      metal,
      x + side * 0.17, 0.025, z
    );
  }

  for (let z = 12; z > END + 8; z -= 12) {
    addDoor(-1, z);
    addDoor(1, z - 5);
  }

  // ==========================================
  // 16. Wall posters and signage
  // ==========================================

  function createPosterTexture(title, subtitle, color, seed) {

    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 640;

    const c = canvas.getContext("2d");

    const rand = makeRandom(seed);

    c.fillStyle = "#e9e6da";
    c.fillRect(0, 0, 512, 640);

    c.fillStyle = color;
    c.fillRect(0, 0, 512, 110);

    c.fillStyle = "#ffffff";
    c.font = "bold 35px sans-serif";
    c.fillText(title, 28, 70);

    c.fillStyle = "#303332";
    c.font = "bold 30px sans-serif";
    c.fillText(subtitle, 32, 165);

    // Illustration area
    c.fillStyle = "#cbd1cc";
    c.fillRect(32, 195, 448, 240);

    c.fillStyle = "#76918f";
    c.fillRect(48, 211, 416, 208);

    // Building illustration
    c.fillStyle = "#ece7d7";
    c.fillRect(100, 265, 300, 120);

    c.fillStyle = "#526a6b";

    for (let i = 0; i < 5; i++) {
      c.fillRect(120 + i * 55, 280, 27, 70);
    }

    c.fillStyle = "#ffffff";
    c.font = "bold 24px sans-serif";
    c.fillText("INFORMATION", 35, 490);

    c.fillStyle = "#555555";
    c.font = "19px sans-serif";
    c.fillText("PLEASE CHECK THE NOTICE", 35, 535);
    c.fillText("THANK YOU FOR YOUR", 35, 570);
    c.fillText("COOPERATION.", 35, 600);

    // Fine printing
    c.strokeStyle = "#999999";
    c.lineWidth = 2;

    for (let i = 0; i < 7; i++) {
      const y = 615 + i * 3;
      c.beginPath();
      c.moveTo(rand() * 30, y);
      c.lineTo(400 + rand() * 80, y);
      c.stroke();
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.encoding = THREE.sRGBEncoding;

    return texture;
  }

  function addPoster(side, z, title, subtitle, color, seed) {

    const x = side * 3.79;

    // Frame
    box(
      0.07, 1.40, 1.08,
      darkMetal,
      x, 2.15, z
    );

    // Poster
    const texture = createPosterTexture(
      title, subtitle, color, seed
    );

    const poster = new THREE.Mesh(
      new THREE.PlaneGeometry(1.0, 1.30),
      new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      })
    );

    poster.position.set(
      x + side * 0.045,
      2.15,
      z
    );

    poster.rotation.y =
      side < 0 ? Math.PI / 2 : -Math.PI / 2;

    scene.add(poster);
  }

  for (let z = 8; z > END + 6; z -= 18) {

    addPoster(
      -1, z,
      "INFORMATION",
      "地下通路のご案内",
      "#36566c",
      z + 100
    );

    addPoster(
      1, z - 8,
      "GUIDE",
      "施設のご案内",
      "#536c58",
      z + 200
    );
  }

  // ==========================================
  // 17. Direction signs
  // ==========================================

  function createSignTexture(text, bg) {

    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 160;

    const c = canvas.getContext("2d");

    c.fillStyle = bg;
    c.fillRect(0, 0, 512, 160);

    c.fillStyle = "#ffffff";
    c.font = "bold 68px sans-serif";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(text, 256, 80);

    return makeCanvasTexture(canvas, true);
  }

  function addSign(side, z, text, color) {

    const x = side * 3.72;

    box(
      0.10, 0.48, 1.75,
      darkMetal,
      x, 2.85, z
    );

    const texture = createSignTexture(text, color);

    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(1.65, 0.40),
      new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      })
    );

    sign.position.set(
      x + side * 0.06,
      2.85,
      z
    );

    sign.rotation.y =
      side < 0 ? Math.PI / 2 : -Math.PI / 2;

    scene.add(sign);
  }

  addSign(-1, -7, "EXIT  1", "#177247");
  addSign(1, -34, "EXIT  2", "#177247");

  // ==========================================
  // 18. Fire extinguishers
  // ==========================================

  function addFireExtinguisher(side, z) {

    const x = side * 3.48;

    // Body
    cylinder(
      0.14, 0.58,
      simple(0xb6332b, 0.45),
      x, 0.54, z
    );

    // Top
    cylinder(
      0.05, 0.11,
      darkMetal,
      x, 0.88, z
    );

    // Handle
    cylinder(
      0.02, 0.22,
      black,
      x + 0.12, 0.90, z,
      0, Math.PI / 3
    );

    // Hose
    cylinder(
      0.025, 0.35,
      black,
      x + 0.13, 0.72, z + 0.1,
      Math.PI / 3
    );

    // Label
    box(
      0.018, 0.19, 0.16,
      white,
      x + 0.14, 0.55, z
    );

    // Base
    cylinder(
      0.15, 0.04,
      darkMetal,
      x, 0.24, z
    );
  }

  addFireExtinguisher(-1, 2);
  addFireExtinguisher(1, -27);

  // ==========================================
  // 19. Emergency wall boxes
  // ==========================================

  function addEmergencyBox(side, z) {

    const x = side * 3.78;

    box(
      0.15, 0.38, 0.48,
      simple(0xb43b32),
      x, 1.5, z
    );

    box(
      0.03, 0.22, 0.30,
      white,
      x + side * 0.09, 1.5, z
    );

    box(
      0.025, 0.06, 0.15,
      simple(0x347c4b),
      x + side * 0.11, 1.5, z
    );
  }

  addEmergencyBox(-1, -14);
  addEmergencyBox(1, -42);

  // ==========================================
  // 20. Exit sign at the end
  // ==========================================

  const exitTexture = createSignTexture(
    "EXIT  →",
    "#166d43"
  );

  const exitBoard = new THREE.Mesh(
    new THREE.PlaneGeometry(1.8, 0.56),
    new THREE.MeshBasicMaterial({
      map: exitTexture,
      side: THREE.DoubleSide
    })
  );

  exitBoard.position.set(0, 2.85, END + 0.15);
  scene.add(exitBoard);

  // ==========================================
  // 21. Player and input
  // ==========================================

  let yaw = 0;
  let pitch = 0;
  let started = false;

  const keys = {};

  const playerSpeed = 3.5;
  const playerRadius = 0.35;

  const movementKeys = [
    "KeyW", "KeyA", "KeyS", "KeyD"
  ];

  function clearKeys() {
    for (const key of movementKeys) {
      keys[key] = false;
    }
  }

  document.addEventListener("keydown", event => {

    if (event.code === "Enter") {

      event.preventDefault();

      if (!event.repeat) {
        startGame();
      }

      return;
    }

    if (movementKeys.includes(event.code)) {
      event.preventDefault();
      keys[event.code] = true;
    }
  });

  document.addEventListener("keyup", event => {
    keys[event.code] = false;
  });

  window.addEventListener("blur", clearKeys);

  // ==========================================
  // 22. Start game with Enter
  // ==========================================

  function startGame() {

    if (
      document.pointerLockElement === renderer.domElement
    ) {
      return;
    }

    try {

      const result =
        renderer.domElement.requestPointerLock();

      if (result && result.catch) {

        result.catch(error => {
          console.log(error);

          description.textContent =
            "マウスロックに失敗しました。Enterでもう一度試してください。";
        });
      }

    } catch (error) {

      console.log(error);

      description.textContent =
        "マウスロックを開始できませんでした。";
    }
  }

  document.addEventListener("pointerlockchange", () => {

    started =
      document.pointerLockElement === renderer.domElement;

    overlay.style.display = started ? "none" : "flex";

    crosshair.style.display = started ? "block" : "none";

    clearKeys();

    if (!started) {

      description.textContent =
        "一時停止中。再開するにはEnterを押してください。";

      enterText.textContent = "PRESS ENTER TO RESUME";
    }
  });

  document.addEventListener("pointerlockerror", () => {

    description.textContent =
      "マウスロックに失敗しました。Enterでもう一度試してください。";
  });

  // ==========================================
  // 23. Mouse look
  // ==========================================

  document.addEventListener("mousemove", event => {

    if (!started) return;

    yaw -= event.movementX * 0.002;
    pitch -= event.movementY * 0.002;

    pitch = Math.max(
      -1.35,
      Math.min(1.35, pitch)
    );

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  });

  // ==========================================
  // 24. Collision
  // ==========================================

  function canMove(x, z) {

    return (
      x > -4 + playerRadius &&
      x < 4 - playerRadius &&
      z > END + playerRadius &&
      z < START - playerRadius
    );
  }

  // ==========================================
  // 25. Movement
  // ==========================================

  const clock = new THREE.Clock();

  let walkingTime = 0;

  function updateMovement(delta) {

    let forward = 0;
    let sideways = 0;

    if (keys["KeyW"]) forward += 1;
    if (keys["KeyS"]) forward -= 1;

    if (keys["KeyD"]) sideways += 1;
    if (keys["KeyA"]) sideways -= 1;

    const length = Math.hypot(forward, sideways);

    if (length > 0) {
      forward /= length;
      sideways /= length;
    }

    const step = playerSpeed * delta;

    const dx =
      -Math.sin(yaw) * forward * step +
      Math.cos(yaw) * sideways * step;

    const dz =
      -Math.cos(yaw) * forward * step -
      Math.sin(yaw) * sideways * step;

    const nextX = camera.position.x + dx;
    const nextZ = camera.position.z + dz;

    if (canMove(nextX, camera.position.z)) {
      camera.position.x = nextX;
    }

    if (canMove(camera.position.x, nextZ)) {
      camera.position.z = nextZ;
    }

    // Subtle walking bob
    if (length > 0) {

      walkingTime += delta * 9;

      camera.position.y =
        1.65 + Math.sin(walkingTime) * 0.018;

    } else {

      camera.position.y = THREE.MathUtils.lerp(
        camera.position.y,
        1.65,
        0.12
      );
    }

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  }

  // ==========================================
  // 26. Animation
  // ==========================================

  function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(
      clock.getDelta(),
      0.05
    );

    if (started) {
      updateMovement(delta);
    }

    renderer.render(scene, camera);
  }

  animate();

  // ==========================================
  // 27. Resize
  // ==========================================

  window.addEventListener("resize", () => {

    camera.aspect =
      window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 1.75)
    );
  });

})();
</script>
