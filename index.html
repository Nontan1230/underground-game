
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNDERGROUND</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #17191c;
  color: white;
  font-family: Arial, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
}

canvas { display: block; }

#overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0009;
}

#panel {
  width: min(90%, 430px);
  padding: 38px 30px;
  text-align: center;
  background: #171a20;
  border: 1px solid #ffffff33;
  border-radius: 10px;
}

#panel h1 {
  font-size: 34px;
  letter-spacing: 5px;
}

#panel p {
  color: #bbb;
  font-size: 14px;
  line-height: 1.9;
}

#enterText {
  margin-top: 25px;
  padding: 13px;
  border: 1px solid #ffffff55;
  border-radius: 5px;
  animation: pulse 1.5s infinite;
  letter-spacing: 3px;
}

@keyframes pulse {
  50% { opacity: .4; }
}

#hud {
  position: fixed;
  z-index: 2;
  top: 18px;
  left: 20px;
  color: #ffffffbb;
  font-size: 13px;
  line-height: 1.8;
  text-shadow: 0 1px 5px black;
  pointer-events: none;
}

#crosshair {
  position: fixed;
  z-index: 3;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #fff;
  transform: translate(-50%, -50%);
  display: none;
  pointer-events: none;
}

#error {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  align-items: center;
  justify-content: center;
  background: #171a20;
  color: #ffaaaa;
  padding: 25px;
  text-align: center;
  font-family: monospace;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  UNDERGROUND<br>
  WASD : MOVE
</div>

<div id="crosshair"></div>

<div id="overlay">
  <div id="panel">
    <h1>UNDERGROUND</h1>

    <p id="description">
      どこまでも続く地下通路。<br>
      周囲を観察しながら進もう。
    </p>

    <p>
      W : 前進<br>
      S : 後退<br>
      A / D : 左右移動<br>
      MOUSE : 視点移動
    </p>

    <div id="enterText">PRESS ENTER</div>
  </div>
</div>

<div id="error">
  <div id="errorText"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {

  // =====================================
  // 1. HTML
  // =====================================

  const container = document.getElementById("game");
  const overlay = document.getElementById("overlay");
  const description = document.getElementById("description");
  const enterText = document.getElementById("enterText");
  const crosshair = document.getElementById("crosshair");
  const errorScreen = document.getElementById("error");
  const errorText = document.getElementById("errorText");

  if (typeof THREE === "undefined") {
    errorScreen.style.display = "flex";
    errorText.textContent = "THREE.JS LOAD ERROR";
    return;
  }

  // =====================================
  // 2. Scene
  // =====================================

  const scene = new THREE.Scene();

  scene.background = new THREE.Color(0x777b7e);
  scene.fog = new THREE.Fog(0x777b7e, 18, 70);

  const camera = new THREE.PerspectiveCamera(
    72,
    window.innerWidth / window.innerHeight,
    0.1,
    150
  );

  camera.position.set(0, 1.65, 15);

  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
  );

  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  container.appendChild(renderer.domElement);

  // =====================================
  // 3. Procedural textures
  // =====================================

  function createTileTexture(base, grout, dirt, seed = 1) {

    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 512;

    const c = canvas.getContext("2d");

    c.fillStyle = grout;
    c.fillRect(0, 0, 512, 512);

    let randomSeed = seed;

    function rand() {
      randomSeed = (randomSeed * 1664525 + 1013904223) >>> 0;
      return randomSeed / 4294967296;
    }

    const size = 128;
    const gap = 5;

    for (let y = 0; y < 4; y++) {
      for (let x = 0; x < 4; x++) {

        const px = x * size + gap;
        const py = y * size + gap;

        const variation = Math.floor(rand() * 12);

        c.fillStyle = `rgb(
          ${Math.min(255, base[0] + variation)},
          ${Math.min(255, base[1] + variation)},
          ${Math.min(255, base[2] + variation)}
        )`;

        c.fillRect(
          px, py,
          size - gap * 2,
          size - gap * 2
        );

        const gradient = c.createLinearGradient(
          px, py, px + 115, py + 120
        );

        gradient.addColorStop(0, "#ffffff1c");
        gradient.addColorStop(1, "#00000012");

        c.fillStyle = gradient;
        c.fillRect(
          px, py,
          size - gap * 2,
          size - gap * 2
        );

        // Small surface stains
        for (let i = 0; i < 15; i++) {
          c.fillStyle = dirt + (rand() > .5 ? "12" : "08");
          c.beginPath();
          c.arc(
            px + rand() * 110,
            py + rand() * 110,
            rand() * 4,
            0, Math.PI * 2
          );
          c.fill();
        }
      }
    }

    const texture = new THREE.CanvasTexture(canvas);

    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    texture.encoding = THREE.sRGBEncoding;

    return texture;
  }

  function createGrimeTexture() {

    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;

    const c = canvas.getContext("2d");

    c.clearRect(0, 0, 256, 256);

    for (let i = 0; i < 180; i++) {

      const x = Math.random() * 256;
      const y = Math.random() * 256;
      const r = Math.random() * 15 + 2;

      const g = c.createRadialGradient(
        x, y, 0,
        x, y, r
      );

      g.addColorStop(0, "rgba(45,43,38,0.13)");
      g.addColorStop(1, "rgba(45,43,38,0)");

      c.fillStyle = g;
      c.fillRect(x - r, y - r, r * 2, r * 2);
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.encoding = THREE.sRGBEncoding;

    return texture;
  }

  const wallTexture = createTileTexture(
    [207, 207, 200],
    "#999994",
    "#777166",
    21
  );

  const floorTexture = createTileTexture(
    [105, 108, 109],
    "#55585a",
    "#373633",
    35
  );

  const ceilingTexture = createTileTexture(
    [181, 181, 174],
    "#999a96",
    "#858078",
    51
  );

  const grimeTexture = createGrimeTexture();

  // =====================================
  // 4. Materials
  // =====================================

  function mat(color, roughness = 0.9) {
    return new THREE.MeshStandardMaterial({
      color,
      roughness
    });
  }

  const wallBaseMat = mat(0xc9c9c3);
  const floorBaseMat = mat(0x626467);
  const ceilingBaseMat = mat(0xb4b4ae);

  const wallTileMat = new THREE.MeshStandardMaterial({
    map: wallTexture,
    roughness: 0.88
  });

  const floorTileMat = new THREE.MeshStandardMaterial({
    map: floorTexture,
    roughness: 0.96
  });

  const ceilingTileMat = new THREE.MeshStandardMaterial({
    map: ceilingTexture,
    roughness: 0.95
  });

  const darkMetal = mat(0x414447, 0.65);
  const metal = mat(0x878b8c, 0.48);
  const doorMat = mat(0x777c7d, 0.8);
  const yellowMat = mat(0xd5b22f);
  const whiteMat = mat(0xe8e7dd);
  const blackMat = mat(0x25282a);

  const lampMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xfff1d8,
    emissiveIntensity: 2.5
  });

  // =====================================
  // 5. Lighting
  // =====================================

  scene.add(
    new THREE.AmbientLight(0xffffff, 0.36)
  );

  scene.add(
    new THREE.HemisphereLight(
      0xe9efff,
      0x55515a,
      0.55
    )
  );

  // =====================================
  // 6. Helper functions
  // =====================================

  function box(w, h, d, material, x, y, z, cast = false) {

    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      material
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = cast;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
  }

  function plane(w, h, material, x, y, z, rotationX = 0, rotationY = 0) {

    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      material
    );

    mesh.position.set(x, y, z);
    mesh.rotation.set(rotationX, rotationY, 0);

    scene.add(mesh);

    return mesh;
  }

  function cylinder(radius, length, material, x, y, z, rotationX = 0) {

    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius, radius, length, 12
      ),
      material
    );

    mesh.position.set(x, y, z);
    mesh.rotation.x = rotationX;

    scene.add(mesh);

    return mesh;
  }

  // =====================================
  // 7. Corridor structure
  // =====================================

  const W = 8;
  const START = 25;
  const END = -65;
  const LENGTH = START - END;
  const CENTER = (START + END) / 2;

  // Floor base
  box(W, 0.22, LENGTH, floorBaseMat, 0, -0.11, CENTER);

  // Ceiling base
  box(W, 0.22, LENGTH, ceilingBaseMat, 0, 3.61, CENTER);

  // Wall bases
  box(0.22, 3.5, LENGTH, wallBaseMat, -4, 1.65, CENTER);
  box(0.22, 3.5, LENGTH, wallBaseMat, 4, 1.65, CENTER);

  // End wall
  box(W, 3.5, 0.22, wallBaseMat, 0, 1.65, END);

  // Floor tiles
  const floorPlaneMat = floorTileMat.clone();
  floorPlaneMat.side = THREE.DoubleSide;
  floorPlaneMat.map = floorTexture.clone();
  floorPlaneMat.map.repeat.set(4, 45);

  plane(
    W, LENGTH,
    floorPlaneMat,
    0, 0.006, CENTER,
    -Math.PI / 2
  );

  // Ceiling panels
  const ceilingPlaneMat = ceilingTileMat.clone();
  ceilingPlaneMat.side = THREE.DoubleSide;
  ceilingPlaneMat.map = ceilingTexture.clone();
  ceilingPlaneMat.map.repeat.set(4, 45);

  plane(
    W, LENGTH,
    ceilingPlaneMat,
    0, 3.49, CENTER,
    Math.PI / 2
  );

  // Wall inner surfaces
  const leftWallMat = wallTileMat.clone();
  leftWallMat.side = THREE.DoubleSide;
  leftWallMat.map = wallTexture.clone();
  leftWallMat.map.repeat.set(45, 3);

  const rightWallMat = leftWallMat.clone();
  rightWallMat.map = leftWallMat.map.clone();

  plane(
    LENGTH, 3.45,
    leftWallMat,
    -3.884, 1.65, CENTER,
    0, Math.PI / 2
  );

  plane(
    LENGTH, 3.45,
    rightWallMat,
    3.884, 1.65, CENTER,
    0, -Math.PI / 2
  );

  // =====================================
  // 8. Wall grime and skirting
  // =====================================

  const grimeMat = new THREE.MeshBasicMaterial({
    map: grimeTexture,
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  for (let z = 18; z > END + 3; z -= 9) {

    plane(
      1.5, 1.2,
      grimeMat,
      -3.872, 0.85, z,
      0, Math.PI / 2
    );

    plane(
      1.2, 0.9,
      grimeMat,
      3.872, 1.0, z - 4,
      0, -Math.PI / 2
    );
  }

  // Baseboards
  for (const side of [-1, 1]) {

    box(
      0.07, 0.18, LENGTH,
      darkMetal,
      side * 3.84, 0.1, CENTER
    );

    box(
      0.08, 0.08, LENGTH,
      metal,
      side * 3.82, 0.22, CENTER
    );
  }

  // Ceiling edge strips
  for (const side of [-1, 1]) {
    box(
      0.16, 0.14, LENGTH,
      darkMetal,
      side * 3.84, 3.39, CENTER
    );
  }

  // =====================================
  // 9. Tactile paving
  // =====================================

  box(
    0.85, 0.045, LENGTH,
    yellowMat,
    -1.0, 0.03, CENTER
  );

  const tactileDotMat = mat(0xe7c84f);

  for (let z = START - 1; z > END + 1; z -= 0.55) {

    for (let x = -1.3; x < -0.6; x += 0.28) {

      const dot = new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.055, 0.055, 0.035, 10
        ),
        tactileDotMat
      );

      dot.position.set(x, 0.066, z);
      scene.add(dot);
    }
  }

  // Floor drains
  for (let z = 12; z > END + 5; z -= 21) {

    box(
      0.35, 0.025, 0.45,
      darkMetal,
      3.1, 0.025, z
    );

    for (let i = 0; i < 5; i++) {
      box(
        0.02, 0.03, 0.35,
        blackMat,
        2.95 + i * 0.07, 0.04, z
      );
    }
  }

  // =====================================
  // 10. Ceiling pipes
  // =====================================

  for (const x of [-3.3, 3.3]) {

    cylinder(
      0.055, LENGTH,
      metal,
      x, 3.25, CENTER,
      Math.PI / 2
    );

    cylinder(
      0.035, LENGTH,
      darkMetal,
      x + (x < 0 ? -0.18 : 0.18),
      3.17, CENTER,
      Math.PI / 2
    );
  }

  // =====================================
  // 11. Fluorescent lights
  // =====================================

  function addLamp(z) {

    // Housing
    box(
      2.4, 0.09, 1.15,
      darkMetal,
      0, 3.38, z
    );

    // Light panel
    box(
      2.18, 0.035, 0.92,
      lampMat,
      0, 3.315, z
    );

    // Diffuser frame
    box(
      2.3, 0.025, 0.04,
      metal,
      0, 3.29, z - 0.47
    );

    box(
      2.3, 0.025, 0.04,
      metal,
      0, 3.29, z + 0.47
    );

    // Light source
    const light = new THREE.PointLight(
      0xffefd9,
      1.25,
      15,
      2
    );

    light.position.set(0, 3.05, z);
    scene.add(light);

    // Soft light pool on floor
    const glowCanvas = document.createElement("canvas");
    glowCanvas.width = 128;
    glowCanvas.height = 128;

    const gc = glowCanvas.getContext("2d");
    const grad = gc.createRadialGradient(
      64, 64, 5,
      64, 64, 64
    );

    grad.addColorStop(0, "rgba(255,240,210,0.18)");
    grad.addColorStop(1, "rgba(255,240,210,0)");

    gc.fillStyle = grad;
    gc.fillRect(0, 0, 128, 128);

    const glowTexture = new THREE.CanvasTexture(glowCanvas);

    const glow = new THREE.Mesh(
      new THREE.PlaneGeometry(7, 8),
      new THREE.MeshBasicMaterial({
        map: glowTexture,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );

    glow.rotation.x = -Math.PI / 2;
    glow.position.set(0, 0.018, z);
    scene.add(glow);
  }

  for (let z = 19; z > END + 3; z -= 9) {
    addLamp(z);
  }

  // =====================================
  // 12. Doors
  // =====================================

  function addDoor(side, z) {

    const x = side * 3.80;

    // Door frame
    box(
      0.08, 2.42, 1.8,
      darkMetal,
      x, 1.25, z
    );

    // Door panel
    box(
      0.045, 2.28, 1.58,
      doorMat,
      x + side * 0.05, 1.18, z
    );

    // Inner panel
    box(
      0.025, 1.5, 1.25,
      metal,
      x + side * 0.08, 1.35, z
    );

    // Handle
    box(
      0.05, 0.15, 0.07,
      blackMat,
      x + side * 0.1, 1.12, z - 0.55
    );

    // Small door label
    box(
      0.035, 0.22, 0.42,
      whiteMat,
      x + side * 0.09, 2.05, z
    );

    // Door number
    box(
      0.025, 0.025, 0.025,
      darkMetal,
      x + side * 0.12, 2.08, z
    );
  }

  for (let z = 12; z > END + 7; z -= 12) {
    addDoor(-1, z);
    addDoor(1, z - 5);
  }

  // =====================================
  // 13. Posters
  // =====================================

  function makePoster(title, subtitle, color) {

    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 640;

    const c = canvas.getContext("2d");

    c.fillStyle = "#eae7db";
    c.fillRect(0, 0, 512, 640);

    c.fillStyle = color;
    c.fillRect(0, 0, 512, 115);

    c.fillStyle = "#ffffff";
    c.font = "bold 37px sans-serif";
    c.fillText(title, 28, 72);

    c.fillStyle = "#333333";
    c.font = "bold 30px sans-serif";
    c.fillText(subtitle, 32, 172);

    c.fillStyle = "#cbd3cf";
    c.fillRect(35, 210, 442, 245);

    c.fillStyle = "#7c9a97";
    c.fillRect(52, 228, 408, 209);

    c.fillStyle = "#ffffff";
    c.font = "bold 28px sans-serif";
    c.fillText("INFORMATION", 35, 520);

    c.fillStyle = "#555555";
    c.font = "20px sans-serif";

    c.fillText("PLEASE CHECK THE NOTICE.", 35, 565);
    c.fillText("THANK YOU FOR YOUR", 35, 598);

    const texture = new THREE.CanvasTexture(canvas);
    texture.encoding = THREE.sRGBEncoding;

    return texture;
  }

  function addPoster(side, z, title, subtitle, color) {

    const x = side * 3.865;

    // Frame
    box(
      0.07, 1.35, 1.05,
      darkMetal,
      x, 2.15, z
    );

    const texture = makePoster(title, subtitle, color);

    const poster = new THREE.Mesh(
      new THREE.PlaneGeometry(0.96, 1.26),
      new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      })
    );

    poster.position.set(
      x + side * 0.045,
      2.15,
      z
    );

    poster.rotation.y = side < 0
      ? Math.PI / 2
      : -Math.PI / 2;

    scene.add(poster);
  }

  for (let z = 8; z > END + 5; z -= 18) {

    addPoster(
      -1, z,
      "INFORMATION",
      "お知らせ",
      "#36566c"
    );

    addPoster(
      1, z - 8,
      "GUIDE",
      "ご案内",
      "#6a796b"
    );
  }

  // =====================================
  // 14. Emergency equipment
  // =====================================

  function addFireExtinguisher(side, z) {

    const x = side * 3.55;

    cylinder(
      0.13, 0.58,
      mat(0xb52f28, 0.55),
      x, 0.55, z
    );

    cylinder(
      0.055, 0.1,
      darkMetal,
      x, 0.87, z
    );

    cylinder(
      0.025, 0.25,
      blackMat,
      x + 0.12, 0.89, z,
      Math.PI / 3
    );

    box(
      0.025, 0.16, 0.12,
      whiteMat,
      x + side * 0.14, 0.57, z
    );
  }

  addFireExtinguisher(-1, 2);
  addFireExtinguisher(1, -24);

  // Emergency wall boxes
  function addEmergencyBox(side, z) {

    const x = side * 3.85;

    box(
      0.12, 0.35, 0.42,
      mat(0xb13a32),
      x, 1.5, z
    );

    box(
      0.03, 0.18, 0.28,
      whiteMat,
      x + side * 0.08, 1.5, z
    );
  }

  addEmergencyBox(-1, -12);
  addEmergencyBox(1, -38);

  // =====================================
  // 15. Exit sign
  // =====================================

  const exitCanvas = document.createElement("canvas");
  exitCanvas.width = 512;
  exitCanvas.height = 160;

  const ec = exitCanvas.getContext("2d");

  ec.fillStyle = "#126d43";
  ec.fillRect(0, 0, 512, 160);

  ec.fillStyle = "#ffffff";
  ec.font = "bold 90px sans-serif";
  ec.textAlign = "center";
  ec.fillText("EXIT →", 256, 112);

  const exitTexture = new THREE.CanvasTexture(exitCanvas);

  const exitBoard = new THREE.Mesh(
    new THREE.PlaneGeometry(1.8, 0.56),
    new THREE.MeshBasicMaterial({
      map: exitTexture,
      side: THREE.DoubleSide
    })
  );

  exitBoard.position.set(0, 2.95, END + 0.15);
  scene.add(exitBoard);

  // =====================================
  // 16. Player and controls
  // =====================================

  let yaw = 0;
  let pitch = 0;
  let started = false;

  const keys = {};

  const speed = 3.5;
  const radius = 0.35;

  const movementKeys = [
    "KeyW", "KeyA", "KeyS", "KeyD"
  ];

  function clearKeys() {
    for (const key of movementKeys) {
      keys[key] = false;
    }
  }

  document.addEventListener("keydown", e => {

    if (e.code === "Enter") {
      e.preventDefault();

      if (!e.repeat) {
        startGame();
      }

      return;
    }

    if (movementKeys.includes(e.code)) {
      e.preventDefault();
      keys[e.code] = true;
    }
  });

  document.addEventListener("keyup", e => {
    keys[e.code] = false;
  });

  window.addEventListener("blur", clearKeys);

  // =====================================
  // 17. Start / pointer lock
  // =====================================

  function startGame() {

    if (
      document.pointerLockElement === renderer.domElement
    ) {
      return;
    }

    try {

      const result =
        renderer.domElement.requestPointerLock();

      if (result && result.catch) {
        result.catch(err => {
          console.log("Pointer lock failed:", err);

          description.textContent =
            "マウスロックに失敗しました。もう一度Enterを押してください。";
        });
      }

    } catch (err) {

      console.log(err);

      description.textContent =
        "マウスロックを開始できませんでした。";
    }
  }

  document.addEventListener("pointerlockchange", () => {

    started =
      document.pointerLockElement === renderer.domElement;

    overlay.style.display = started ? "none" : "flex";

    crosshair.style.display = started ? "block" : "none";

    clearKeys();

    if (!started) {
      description.textContent =
        "一時停止中。Enterで再開できます。";

      enterText.textContent = "PRESS ENTER TO RESUME";
    }
  });

  document.addEventListener("pointerlockerror", () => {

    description.textContent =
      "マウスロックに失敗しました。Enterでもう一度試してください。";
  });

  // =====================================
  // 18. Mouse look
  // =====================================

  document.addEventListener("mousemove", e => {

    if (!started) return;

    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;

    pitch = Math.max(
      -1.35,
      Math.min(1.35, pitch)
    );

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  });

  // =====================================
  // 19. Collision
  // =====================================

  function canMove(x, z) {

    return (
      x > -4 + radius &&
      x < 4 - radius &&
      z > END + radius &&
      z < START - radius
    );
  }

  // =====================================
  // 20. Movement
  // =====================================

  const clock = new THREE.Clock();

  function updateMovement(delta) {

    let forward = 0;
    let side = 0;

    if (keys["KeyW"]) forward += 1;
    if (keys["KeyS"]) forward -= 1;

    if (keys["KeyD"]) side += 1;
    if (keys["KeyA"]) side -= 1;

    const length = Math.hypot(forward, side);

    if (length > 0) {
      forward /= length;
      side /= length;
    }

    const step = speed * delta;

    const dx =
      -Math.sin(yaw) * forward * step +
      Math.cos(yaw) * side * step;

    const dz =
      -Math.cos(yaw) * forward * step -
      Math.sin(yaw) * side * step;

    const nextX = camera.position.x + dx;
    const nextZ = camera.position.z + dz;

    if (canMove(nextX, camera.position.z)) {
      camera.position.x = nextX;
    }

    if (canMove(camera.position.x, nextZ)) {
      camera.position.z = nextZ;
    }

    // Subtle walking movement
    if (length > 0) {
      camera.position.y =
        1.65 + Math.sin(clock.elapsedTime * 9) * 0.018;
    } else {
      camera.position.y = THREE.MathUtils.lerp(
        camera.position.y,
        1.65,
        0.12
      );
    }

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  }

  // =====================================
  // 21. Render
  // =====================================

  function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    if (started) {
      updateMovement(delta);
    }

    renderer.render(scene, camera);
  }

  animate();

  // =====================================
  // 22. Resize
  // =====================================

  window.addEventListener("resize", () => {

    camera.aspect =
      window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );
  });

})();
</script>

</body>
</html>
