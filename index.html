
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNDERGROUND</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #151719;
  color: white;
  font-family: Arial, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
}

#overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0008;
}

#panel {
  width: min(90%, 430px);
  padding: 35px 28px;
  text-align: center;
  background: #171a20;
  border: 1px solid #ffffff33;
  border-radius: 10px;
  box-shadow: 0 15px 60px #0008;
}

#panel h1 {
  margin: 0 0 15px;
  font-size: 34px;
  letter-spacing: 5px;
}

#panel p {
  color: #bbb;
  font-size: 14px;
  line-height: 1.9;
}

#enterText {
  margin-top: 24px;
  padding: 13px;
  border: 1px solid #ffffff55;
  border-radius: 5px;
  letter-spacing: 3px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  50% { opacity: .4; }
}

#hud {
  position: fixed;
  z-index: 2;
  top: 18px;
  left: 20px;
  color: #ffffffbb;
  font-size: 13px;
  line-height: 1.8;
  text-shadow: 0 1px 5px black;
  pointer-events: none;
}

#crosshair {
  position: fixed;
  z-index: 3;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: white;
  transform: translate(-50%, -50%);
  display: none;
  pointer-events: none;
}

#error {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  align-items: center;
  justify-content: center;
  background: #171a20;
  color: #ffaaaa;
  padding: 25px;
  text-align: center;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  UNDERGROUND<br>
  WASD : MOVE
</div>

<div id="crosshair"></div>

<div id="overlay">
  <div id="panel">
    <h1>UNDERGROUND</h1>
    <p id="description">
      どこまでも続く地下通路。<br>
      周囲を観察しながら進もう。
    </p>

    <p>
      W : 前進<br>
      S : 後退<br>
      A / D : 左右移動<br>
      MOUSE : 視点移動
    </p>

    <div id="enterText">PRESS ENTER</div>
  </div>
</div>

<div id="error">
  <div id="errorText"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {

// ==========================================
// 1. HTML
// ==========================================

const container = document.getElementById("game");
const overlay = document.getElementById("overlay");
const description = document.getElementById("description");
const enterText = document.getElementById("enterText");
const crosshair = document.getElementById("crosshair");
const errorScreen = document.getElementById("error");
const errorText = document.getElementById("errorText");

if (typeof THREE === "undefined") {
  errorScreen.style.display = "flex";
  errorText.textContent = "THREE.JS LOAD ERROR";
  return;
}

// ==========================================
// 2. WORLD SETTINGS
// ==========================================

const WORLD = {
  width: 8,
  height: 3.5,
  start: 24,
  end: -76
};

WORLD.length = WORLD.start - WORLD.end;
WORLD.center = (WORLD.start + WORLD.end) / 2;

// ==========================================
// 3. THREE.JS
// ==========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x777b7d);
scene.fog = new THREE.Fog(0x777b7d, 22, 76);

const camera = new THREE.PerspectiveCamera(
  72,
  window.innerWidth / window.innerHeight,
  0.1,
  150
);

camera.position.set(0, 1.62, 18);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.75)
);

renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

container.appendChild(renderer.domElement);

// ==========================================
// 4. RANDOM
// ==========================================

function randomGenerator(seed) {
  let n = seed >>> 0;

  return () => {
    n = (n * 1664525 + 1013904223) >>> 0;
    return n / 4294967296;
  };
}

// ==========================================
// 5. TEXTURE HELPERS
// ==========================================

function canvasTexture(canvas, colorTexture = false) {
  const texture = new THREE.CanvasTexture(canvas);

  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy =
    renderer.capabilities.getMaxAnisotropy();

  if (colorTexture) {
    texture.encoding = THREE.sRGBEncoding;
  }

  return texture;
}

function repeatedTexture(texture, x, y) {
  const result = texture.clone();

  result.wrapS = THREE.RepeatWrapping;
  result.wrapT = THREE.RepeatWrapping;
  result.repeat.set(x, y);
  result.needsUpdate = true;

  return result;
}

// ==========================================
// 6. NORMAL MAP GENERATOR
// ==========================================

function makeNormalMap(heightCanvas, strength = 2) {

  const width = heightCanvas.width;
  const height = heightCanvas.height;

  const source = heightCanvas.getContext("2d")
    .getImageData(0, 0, width, height);

  const output = document.createElement("canvas");
  output.width = width;
  output.height = height;

  const ctx = output.getContext("2d");
  const result = ctx.createImageData(width, height);

  function sample(x, y) {
    x = (x + width) % width;
    y = (y + height) % height;

    return source.data[(y * width + x) * 4];
  }

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {

      const dx = (sample(x + 1, y) - sample(x - 1, y)) / 255;
      const dy = (sample(x, y + 1) - sample(x, y - 1)) / 255;

      let nx = -dx * strength;
      let ny = -dy * strength;
      let nz = 1;

      const len = Math.hypot(nx, ny, nz);

      nx /= len;
      ny /= len;
      nz /= len;

      const i = (y * width + x) * 4;

      result.data[i] = (nx * .5 + .5) * 255;
      result.data[i + 1] = (ny * .5 + .5) * 255;
      result.data[i + 2] = (nz * .5 + .5) * 255;
      result.data[i + 3] = 255;
    }
  }

  ctx.putImageData(result, 0, 0);

  return canvasTexture(output);
}

// ==========================================
// 7. TILE TEXTURE GENERATOR
// ==========================================

function createTileSet(options) {

  const size = 512;
  const cols = options.cols;
  const rows = options.rows;

  const cellW = size / cols;
  const cellH = size / rows;

  const color = document.createElement("canvas");
  const height = document.createElement("canvas");
  const rough = document.createElement("canvas");

  color.width = height.width = rough.width = size;
  color.height = height.height = rough.height = size;

  const c = color.getContext("2d");
  const h = height.getContext("2d");
  const r = rough.getContext("2d");

  const rand = randomGenerator(options.seed);

  c.fillStyle = options.grout;
  c.fillRect(0, 0, size, size);

  h.fillStyle = "#444";
  h.fillRect(0, 0, size, size);

  r.fillStyle = "#dddddd";
  r.fillRect(0, 0, size, size);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {

      const px = x * cellW;
      const py = y * cellH;

      const gap = options.gap || 3;

      const w = cellW - gap * 2;
      const hh = cellH - gap * 2;

      const variation = Math.floor(rand() * 11 - 5);

      const red = options.base[0] + variation;
      const green = options.base[1] + variation;
      const blue = options.base[2] + variation;

      // Tile body
      c.fillStyle = `rgb(${red},${green},${blue})`;
      c.fillRect(px + gap, py + gap, w, hh);

      // Surface shading
      const g = c.createLinearGradient(
        px, py, px + cellW, py + cellH
      );

      g.addColorStop(0, "#ffffff24");
      g.addColorStop(.5, "#ffffff00");
      g.addColorStop(1, "#00000020");

      c.fillStyle = g;
      c.fillRect(px + gap, py + gap, w, hh);

      // Subtle stains and grain
      for (let i = 0; i < 70; i++) {

        const sx = px + gap + rand() * w;
        const sy = py + gap + rand() * hh;

        c.fillStyle = rand() > .5
          ? "rgba(30,30,30,.035)"
          : "rgba(255,255,255,.04)";

        c.fillRect(sx, sy, rand() * 2 + .3, 1);
      }

      // Height information
      h.fillStyle = "#484848";
      h.fillRect(px, py, cellW, cellH);

      h.fillStyle = "#999999";
      h.fillRect(px + gap, py + gap, w, hh);

      h.fillStyle = "#bbbbbb";
      h.fillRect(
        px + gap + 3,
        py + gap + 3,
        w - 6,
        hh - 6
      );

      // Roughness
      const rv = Math.floor(170 + rand() * 45);

      r.fillStyle = `rgb(${rv},${rv},${rv})`;
      r.fillRect(px + gap, py + gap, w, hh);
    }
  }

  // Natural discoloration
  if (options.stains) {

    for (let i = 0; i < 350; i++) {

      const x = rand() * size;
      const y = rand() * size;
      const radius = rand() * 4 + .5;

      c.fillStyle = `rgba(75,65,50,${rand() * .09})`;

      c.beginPath();
      c.arc(x, y, radius, 0, Math.PI * 2);
      c.fill();
    }
  }

  const heightNormal = makeNormalMap(height, 2.2);

  return {
    color: canvasTexture(color, true),
    normal: heightNormal,
    roughness: canvasTexture(rough)
  };
}

// ==========================================
// 8. MATERIAL SETS
// ==========================================

// Wall: 30cm x 10cm tile modules.
// 8 columns x 24 rows = 2.4m x 2.4m.

const wallTiles = createTileSet({
  cols: 8,
  rows: 24,
  base: [215, 214, 207],
  grout: "#aaa9a1",
  gap: 2,
  seed: 124,
  stains: true
});

// Floor: 60cm square stone tiles.

const floorTiles = createTileSet({
  cols: 4,
  rows: 4,
  base: [115, 117, 116],
  grout: "#55585a",
  gap: 4,
  seed: 356,
  stains: true
});

// Ceiling: 120cm x 60cm panels.

const ceilingTiles = createTileSet({
  cols: 4,
  rows: 8,
  base: [186, 185, 178],
  grout: "#aaa9a1",
  gap: 3,
  seed: 817,
  stains: false
});

// ==========================================
// 9. MATERIALS
// ==========================================

function surfaceMaterial(set, roughness, scale) {

  return new THREE.MeshStandardMaterial({
    map: set.color,
    normalMap: set.normal,
    roughnessMap: set.roughness,
    normalScale: new THREE.Vector2(scale, scale),
    roughness,
    side: THREE.DoubleSide
  });
}

const wallMat = surfaceMaterial(wallTiles, .84, .55);
const floorMat = surfaceMaterial(floorTiles, .72, .7);
const ceilingMat = surfaceMaterial(ceilingTiles, .92, .45);

function standard(color, roughness = .8, metalness = 0) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });
}

const darkMetal = standard(0x414548, .55, .35);
const metal = standard(0x969998, .4, .5);
const doorMat = standard(0x888b8a, .75);
const black = standard(0x26292b, .8);
const white = standard(0xe8e6df, .8);
const yellow = standard(0xd3b43b, .85);

const lampMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  emissive: 0xfff0d6,
  emissiveIntensity: 2.1,
  roughness: .35
});

// ==========================================
// 10. LIGHTING
// ==========================================

scene.add(
  new THREE.AmbientLight(0xffffff, .38)
);

scene.add(
  new THREE.HemisphereLight(
    0xf2f3ff,
    0x55545a,
    .48
  )
);

// Mild broad illumination and shadows.

const directional = new THREE.DirectionalLight(
  0xffffff, .28
);

directional.position.set(-4, 8, 18);
directional.target.position.set(0, 0, -15);
directional.castShadow = true;

directional.shadow.mapSize.set(1024, 1024);
directional.shadow.camera.left = -7;
directional.shadow.camera.right = 7;
directional.shadow.camera.top = 7;
directional.shadow.camera.bottom = -4;
directional.shadow.camera.near = .5;
directional.shadow.camera.far = 38;
directional.shadow.bias = -.0004;

scene.add(directional);
scene.add(directional.target);

// ==========================================
// 11. GEOMETRY HELPERS
// ==========================================

function box(w, h, d, mat, x, y, z, cast = false) {

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;
}

function plane(w, h, mat, x, y, z, rx = 0, ry = 0) {

  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    mat
  );

  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, 0);
  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;
}

function cylinder(radius, length, mat, x, y, z, rx = 0) {

  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, 16),
    mat
  );

  mesh.position.set(x, y, z);
  mesh.rotation.x = rx;
  mesh.castShadow = true;

  scene.add(mesh);

  return mesh;
}

// ==========================================
// 12. CORRIDOR
// ==========================================

const W = WORLD.width;
const H = WORLD.height;
const L = WORLD.length;
const CENTER = WORLD.center;

// Structural floor and ceiling.

box(W, .22, L, standard(0x65676a), 0, -.11, CENTER);
box(W, .22, L, standard(0xb5b4ad), 0, H + .11, CENTER);

// Structural walls.

box(.22, H, L, standard(0xcfcfc8), -4, H / 2, CENTER);
box(.22, H, L, standard(0xcfcfc8), 4, H / 2, CENTER);

// End wall.

box(W, H, .22, standard(0xcfcfc8), 0, H / 2, WORLD.end);

// Floor surface.
// 60cm tile modules.

const floorSurface = floorMat.clone();

floorSurface.map = repeatedTexture(floorTiles.color, W / 2.4, L / 2.4);
floorSurface.normalMap = repeatedTexture(floorTiles.normal, W / 2.4, L / 2.4);
floorSurface.roughnessMap = repeatedTexture(floorTiles.roughness, W / 2.4, L / 2.4);

plane(
  W, L,
  floorSurface,
  0, .006, CENTER,
  -Math.PI / 2
);

// Ceiling surface.
// 120cm x 60cm panels.

const ceilingSurface = ceilingMat.clone();

ceilingSurface.map = repeatedTexture(ceilingTiles.color, W / 4.8, L / 4.8);
ceilingSurface.normalMap = repeatedTexture(ceilingTiles.normal, W / 4.8, L / 4.8);
ceilingSurface.roughnessMap = repeatedTexture(ceilingTiles.roughness, W / 4.8, L / 4.8);

plane(
  W, L,
  ceilingSurface,
  0, H - .005, CENTER,
  Math.PI / 2
);

// Walls.
// 30cm x 10cm tile modules.

const leftWall = wallMat.clone();

leftWall.map = repeatedTexture(
  wallTiles.color, L / 2.4, H / 2.4
);

leftWall.normalMap = repeatedTexture(
  wallTiles.normal, L / 2.4, H / 2.4
);

leftWall.roughnessMap = repeatedTexture(
  wallTiles.roughness, L / 2.4, H / 2.4
);

const rightWall = wallMat.clone();

rightWall.map = leftWall.map.clone();
rightWall.normalMap = leftWall.normalMap.clone();
rightWall.roughnessMap = leftWall.roughnessMap.clone();

plane(
  L, H,
  leftWall,
  -3.89, H / 2, CENTER,
  0, Math.PI / 2
);

plane(
  L, H,
  rightWall,
  3.89, H / 2, CENTER,
  0, -Math.PI / 2
);

// ==========================================
// 13. WALL DETAILS
// ==========================================

// Dark stone skirting.

for (const side of [-1, 1]) {

  box(
    .08, .18, L,
    darkMetal,
    side * 3.83, .10, CENTER
  );

  box(
    .07, .035, L,
    metal,
    side * 3.81, .22, CENTER
  );

  // Upper metal trim.

  box(
    .07, .065, L,
    metal,
    side * 3.84, 3.35, CENTER
  );

  // Ceiling border.

  box(
    .10, .08, L,
    darkMetal,
    side * 3.45, 3.39, CENTER
  );
}

// ==========================================
// 14. TACTILE PAVING
// ==========================================

// Actual directional paving has raised longitudinal bars.
// One continuous path through the middle of the corridor.

function createTactileTexture() {

  const w = 256;
  const h = 160;

  const color = document.createElement("canvas");
  const height = document.createElement("canvas");

  color.width = height.width = w;
  color.height = height.height = h;

  const c = color.getContext("2d");
  const hc = height.getContext("2d");

  c.fillStyle = "#c69f25";
  c.fillRect(0, 0, w, h);

  hc.fillStyle = "#777777";
  hc.fillRect(0, 0, w, h);

  for (let i = 0; i < 5; i++) {

    const x = 15 + i * 49;

    const g = c.createLinearGradient(x - 9, 0, x + 9, 0);

    g.addColorStop(0, "#937723");
    g.addColorStop(.3, "#e4c34a");
    g.addColorStop(.7, "#dfbf44");
    g.addColorStop(1, "#90721f");

    c.fillStyle = g;
    c.fillRect(x - 9, 0, 18, h);

    const hg = hc.createLinearGradient(x - 9, 0, x + 9, 0);

    hg.addColorStop(0, "#555");
    hg.addColorStop(.3, "#dedede");
    hg.addColorStop(.7, "#c8c8c8");
    hg.addColorStop(1, "#555");

    hc.fillStyle = hg;
    hc.fillRect(x - 9, 0, 18, h);
  }

  // Tile joints.

  c.fillStyle = "#a18122";
  c.fillRect(0, 3, w, 2);
  c.fillRect(0, h - 5, w, 2);

  return {
    color: canvasTexture(color, true),
    normal: makeNormalMap(height, 2.3)
  };
}

const tactile = createTactileTexture();

const tactileMat = new THREE.MeshStandardMaterial({
  map: repeatedTexture(tactile.color, 1, L / .3),
  normalMap: repeatedTexture(tactile.normal, 1, L / .3),
  roughness: .9,
  side: THREE.DoubleSide
});

plane(
  .48, L,
  tactileMat,
  0, .034, CENTER,
  -Math.PI / 2
);

// ==========================================
// 15. CEILING PANELS AND VENTS
// ==========================================

// Longitudinal metal channels.

for (const x of [-3.1, -2.7, 2.7, 3.1]) {

  box(
    .065, .065, L,
    darkMetal,
    x, 3.39, CENTER
  );
}

// Access panels.

for (let z = 15; z > WORLD.end + 5; z -= 18) {

  box(
    1.05, .035, 1.3,
    metal,
    -2.2, 3.39, z,
    false
  );

  box(
    .94, .012, 1.18,
    standard(0xb2b2ad),
    -2.2, 3.365, z
  );

  // Screws.

  for (const x of [-2.65, -1.75]) {
    for (const dz of [-.5, .5]) {
      cylinder(
        .018, .012,
        darkMetal,
        x, 3.35, z + dz,
        Math.PI / 2
      );
    }
  }
}

// Ventilation grills.

for (let z = 10; z > WORLD.end + 8; z -= 24) {

  box(
    .85, .045, 1.1,
    darkMetal,
    2.3, 3.37, z
  );

  for (let i = 0; i < 8; i++) {

    box(
      .015, .018, .95,
      metal,
      1.92 + i * .11, 3.335, z
    );
  }
}

// ==========================================
// 16. CEILING LIGHTS
// ==========================================

const lights = [];

const glowCanvas = document.createElement("canvas");
glowCanvas.width = glowCanvas.height = 128;

const gc = glowCanvas.getContext("2d");

const glowGradient = gc.createRadialGradient(
  64, 64, 5,
  64, 64, 64
);

glowGradient.addColorStop(0, "rgba(255,240,214,.22)");
glowGradient.addColorStop(1, "rgba(255,240,214,0)");

gc.fillStyle = glowGradient;
gc.fillRect(0, 0, 128, 128);

const glowTexture = canvasTexture(glowCanvas, true);

const glowMat = new THREE.MeshBasicMaterial({
  map: glowTexture,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide
});

function addLight(z) {

  // Recessed housing.

  box(
    .30, .08, 3.1,
    darkMetal,
    0, 3.40, z
  );

  // Metal frame.

  box(
    .25, .025, 2.95,
    metal,
    0, 3.34, z
  );

  // Diffuser.

  box(
    .20, .018, 2.83,
    lampMaterial,
    0, 3.315, z
  );

  // Glass/reflector cover.

  const cover = new THREE.Mesh(
    new THREE.PlaneGeometry(.17, 2.78),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide
    })
  );

  cover.rotation.x = Math.PI / 2;
  cover.position.set(0, 3.302, z);

  scene.add(cover);

  // Actual lighting.

  const light = new THREE.PointLight(
    0xfff0db,
    1.4,
    17,
    2
  );

  light.position.set(0, 3.0, z);
  scene.add(light);

  // Soft pool of light.

  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(6.8, 8),
    glowMat
  );

  glow.rotation.x = -Math.PI / 2;
  glow.position.set(0, .018, z);

  scene.add(glow);

  lights.push(light);
}

for (let z = 19; z > WORLD.end + 4; z -= 8.5) {
  addLight(z);
}

// ==========================================
// 17. METAL DOORS
// ==========================================

function addServiceDoor(side, z) {

  const x = side * 3.81;

  // Outer frame.

  box(
    .09, 2.48, 1.7,
    darkMetal,
    x, 1.26, z
  );

  // Door body.

  box(
    .055, 2.28, 1.53,
    doorMat,
    x - side * .065, 1.17, z
  );

  // Raised inner panel.

  box(
    .025, 1.85, 1.22,
    metal,
    x - side * .10, 1.2, z
  );

  // Main recessed panel.

  box(
    .018, 1.66, 1.04,
    doorMat,
    x - side * .116, 1.2, z
  );

  // Hinges.

// ==========================================
// 18. POSTER TEXTURES

function createPoster(title, subtitle, color, seed) {

  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 640;

  const c = canvas.getContext("2d");

  const rand = randomGenerator(seed);

  c.fillStyle = "#e9e7dc";
  c.fillRect(0, 0, 512, 640);

  c.fillStyle = color;
  c.fillRect(0, 0, 512, 105);

  c.fillStyle = "#ffffff";
  c.font = "bold 34px sans-serif";
  c.fillText(title, 28, 69);

  c.fillStyle = "#323635";
  c.font = "bold 31px sans-serif";
  c.fillText(subtitle, 32, 165);

  // Illustration.

  c.fillStyle = "#cbd3ce";
  c.fillRect(32, 195, 448, 250);

  c.fillStyle = "#668d88";
  c.fillRect(49, 210, 414, 220);

  c.fillStyle = "#eee9dc";
  c.fillRect(94, 260, 320, 125);

  c.fillStyle = "#607d79";

  for (let i = 0; i < 5; i++) {
    c.fillRect(112 + i * 59, 275, 32, 80);
  }

  c.fillStyle = "#ffffff";
  c.font = "bold 26px sans-serif";
  c.fillText("INFORMATION", 32, 500);

  c.fillStyle = "#555555";
  c.font = "20px sans-serif";

  c.fillText("PLEASE CHECK THE NOTICE", 32, 540);
  c.fillText("THANK YOU FOR YOUR", 32, 575);
  c.fillText("COOPERATION.", 32, 606);

  // Small print.

  c.strokeStyle = "#888888";
  c.lineWidth = 1;

  for (let i = 0; i < 5; i++) {
    const y = 616 + i * 4;
    c.beginPath();
    c.moveTo(20, y);
    c.lineTo(300 + rand() * 180, y);
    c.stroke();
  }

  return canvasTexture(canvas, true);
}

function addPoster(side, z, title, subtitle, color, seed) {

  const x = side * 3.82;

  // Frame.

  box(
    .065, 1.38, 1.05,
    darkMetal,
    x, 2.15, z
  );

  const texture = createPoster(
    title, subtitle, color, seed
  );

  const poster = new THREE.Mesh(
    new THREE.PlaneGeometry(.98, 1.29),
    new THREE.MeshBasicMaterial({
      map: texture,
      side: THREE.DoubleSide
    })
  );

  poster.position.set(
    x - side * .05,
    2.15,
    z
  );

  poster.rotation.y =
    side < 0 ? Math.PI / 2 : -Math.PI / 2;

  scene.add(poster);
}

// ==========================================
// 22. PLAYER
// ==========================================

let yaw = 0;
let pitch = 0;
let started = false;

const keys = {};

const playerSpeed = 3.5;
const radius = .35;

const moveKeys = [
  "KeyW", "KeyA", "KeyS", "KeyD"
];

function clearKeys() {
  for (const key of moveKeys) {
    keys[key] = false;
  }
}

// ==========================================
// 23. KEYBOARD INPUT
// ==========================================

document.addEventListener("keydown", event => {

  if (event.code === "Enter") {
    event.preventDefault();

    if (!event.repeat) {
      startGame();
    }

    return;
  }

  if (moveKeys.includes(event.code)) {
    event.preventDefault();
    keys[event.code] = true;
  }
});

document.addEventListener("keyup", event => {
  keys[event.code] = false;
});

window.addEventListener("blur", clearKeys);

// ==========================================
// 24. START GAME
// ==========================================

function startGame() {

  if (
    document.pointerLockElement === renderer.domElement
  ) return;

  try {

    const result =
      renderer.domElement.requestPointerLock();

    if (result && result.catch) {
      result.catch(error => {
        console.log(error);

        description.textContent =
          "マウスロックに失敗しました。Enterでもう一度試してください。";
      });
    }

  } catch (error) {

    console.log(error);

    description.textContent =
      "マウスロックを開始できませんでした。";
  }
}

document.addEventListener("pointerlockchange", () => {

  started =
    document.pointerLockElement === renderer.domElement;

  overlay.style.display = started ? "none" : "flex";

  crosshair.style.display = started ? "block" : "none";

  clearKeys();

  if (!started) {
    description.textContent =
      "一時停止中。Enterで再開できます。";

    enterText.textContent = "PRESS ENTER TO RESUME";
  }
});

document.addEventListener("pointerlockerror", () => {
  description.textContent =
    "マウスロックに失敗しました。Enterでもう一度試してください。";
});

// ==========================================
// 25. MOUSE LOOK
// ==========================================

document.addEventListener("mousemove", event => {

  if (!started) return;

  yaw -= event.movementX * .002;
  pitch -= event.movementY * .002;

  pitch = Math.max(
    -1.35,
    Math.min(1.35, pitch)
  );

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
});

// ==========================================
// 26. COLLISION
// ==========================================

function canMove(x, z) {

  return (
    x > -4 + radius &&
    x < 4 - radius &&
    z > WORLD.end + radius &&
    z < WORLD.start - radius
  );
}

// ==========================================
// 27. MOVEMENT
// ==========================================

const clock = new THREE.Clock();

let walkingTime = 0;

function updateMovement(delta) {

  let forward = 0;
  let sideways = 0;

  if (keys["KeyW"]) forward += 1;
  if (keys["KeyS"]) forward -= 1;
  if (keys["KeyD"]) sideways += 1;
  if (keys["KeyA"]) sideways -= 1;

  const len = Math.hypot(forward, sideways);

  if (len > 0) {
    forward /= len;
    sideways /= len;
  }

  const step = playerSpeed * delta;

  const dx =
    -Math.sin(yaw) * forward * step +
    Math.cos(yaw) * sideways * step;

  const dz =
    -Math.cos(yaw) * forward * step -
    Math.sin(yaw) * sideways * step;

  const nextX = camera.position.x + dx;
  const nextZ = camera.position.z + dz;

  if (canMove(nextX, camera.position.z)) {
    camera.position.x = nextX;
  }

  if (canMove(camera.position.x, nextZ)) {
    camera.position.z = nextZ;
  }

  // Subtle natural walking movement.

  if (len > 0) {

    walkingTime += delta * 9;

    camera.position.y =
      1.62 + Math.sin(walkingTime) * .016;

  } else {

    camera.position.y = THREE.MathUtils.lerp(
      camera.position.y,
      1.62,
      .12
    );
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

// ==========================================
// 28. ANIMATION
// ==========================================

function animate() {

  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), .05);

  if (started) {
    updateMovement(delta);
  }

  renderer.render(scene, camera);
}

animate();

// ==========================================
// 29. RESIZE
// ==========================================

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 1.75)
  );
});

})();
