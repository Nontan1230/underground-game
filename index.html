
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNDERGROUND</title>
<style>
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #17191b;
  color: #fff;
  font-family: Arial, "Noto Sans JP", sans-serif;
}
#game { position: fixed; inset: 0; }
canvas { display: block; }
#hud {
  position: fixed;
  z-index: 2;
  top: 18px;
  left: 20px;
  color: #ffffffc9;
  font-size: 13px;
  line-height: 1.8;
  text-shadow: 0 1px 5px #000;
  pointer-events: none;
}
#crosshair {
  position: fixed;
  z-index: 3;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #fff;
  transform: translate(-50%, -50%);
  display: none;
  pointer-events: none;
}
#overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0009;
}
#panel {
  width: min(90%, 440px);
  padding: 34px 28px;
  text-align: center;
  background: #171a20;
  border: 1px solid #ffffff33;
  border-radius: 10px;
  box-shadow: 0 15px 60px #0008;
}
#panel h1 {
  margin: 0 0 18px;
  font-size: 34px;
  letter-spacing: 5px;
}
#panel p {
  color: #bbb;
  font-size: 14px;
  line-height: 1.9;
}
#enterText {
  margin-top: 24px;
  padding: 13px;
  border: 1px solid #ffffff55;
  border-radius: 5px;
  letter-spacing: 3px;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 50% { opacity: .4; } }
#error {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  align-items: center;
  justify-content: center;
  background: #171a20;
  color: #ffaaaa;
  padding: 25px;
  text-align: center;
}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  UNDERGROUND<br>
  WASD : MOVE<br>
  SHIFT : RUN
</div>
<div id="crosshair"></div>

<div id="overlay">
  <div id="panel">
    <h1>UNDERGROUND</h1>
    <p id="description">
      地下鉄の通路を進もう。<br>
      周囲を観察しながら進んでください。
    </p>
    <p>
      W : 前進<br>
      S : 後退<br>
      A / D : 左右移動<br>
      SHIFT : 走る<br>
      MOUSE : 視点移動
    </p>
    <div id="enterText">PRESS ENTER</div>
  </div>
</div>

<div id="error"><div id="errorText"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";

// ==========================================
// 1. BASIC SETTINGS
// ==========================================
const container = document.getElementById("game");
const overlay = document.getElementById("overlay");
const description = document.getElementById("description");
const enterText = document.getElementById("enterText");
const crosshair = document.getElementById("crosshair");
const errorScreen = document.getElementById("error");
const errorText = document.getElementById("errorText");

if (typeof THREE === "undefined") {
  errorScreen.style.display = "flex";
  errorText.textContent = "THREE.JS LOAD ERROR";
  return;
}

// Corridor dimensions (meters)
const WORLD = {
  width: 4.5,
  height: 3.5,
  start: 14,
  end: -26
};
WORLD.length = WORLD.start - WORLD.end;
WORLD.center = (WORLD.start + WORLD.end) / 2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171a1d);
scene.fog = new THREE.Fog(0x171a1d, 9, 38);

const camera = new THREE.PerspectiveCamera(
  72,
  window.innerWidth / window.innerHeight,
  0.06,
  90
);
camera.position.set(0, 1.62, 10);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.78;
renderer.shadowMap.enabled = false;
container.appendChild(renderer.domElement);

const W = WORLD.width;
const H = WORLD.height;
const L = WORLD.length;
const Z = WORLD.center;

// ==========================================
// 2. TEXTURE HELPERS
// ==========================================
function makeCanvasTexture(canvas, isColor = true) {
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (isColor) texture.encoding = THREE.sRGBEncoding;
  return texture;
}

function repeated(texture, x, y) {
  const copy = texture.clone();
  copy.wrapS = THREE.RepeatWrapping;
  copy.wrapT = THREE.RepeatWrapping;
  copy.repeat.set(x, y);
  copy.needsUpdate = true;
  return copy;
}

function makeTileTexture(cols, rows, baseColor, groutColor, seed = 1, gap = 3) {
  const size = 512;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  let randomState = seed >>> 0;
  const rand = () => {
    randomState = (randomState * 1664525 + 1013904223) >>> 0;
    return randomState / 4294967296;
  };
  ctx.fillStyle = groutColor;
  ctx.fillRect(0, 0, size, size);
  const cellW = size / cols;
  const cellH = size / rows;

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const x = col * cellW;
      const y = row * cellH;
      const v = Math.floor(rand() * 9 - 4);
      const rgb = baseColor.map(n => Math.max(0, Math.min(255, n + v)));
      ctx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
      ctx.fillRect(x + gap, y + gap, cellW - gap * 2, cellH - gap * 2);

      const shine = ctx.createLinearGradient(x, y, x + cellW, y + cellH);
      shine.addColorStop(0, "#ffffff25");
      shine.addColorStop(0.5, "#ffffff00");
      shine.addColorStop(1, "#00000019");
      ctx.fillStyle = shine;
      ctx.fillRect(x + gap, y + gap, cellW - gap * 2, cellH - gap * 2);

      for (let i = 0; i < 32; i++) {
        ctx.fillStyle = rand() > 0.5 ? "#ffffff0c" : "#0000000a";
        ctx.fillRect(
          x + gap + rand() * (cellW - gap * 2),
          y + gap + rand() * (cellH - gap * 2),
          1 + rand() * 2,
          1
        );
      }
    }
  }
  return makeCanvasTexture(canvas, true);
}

function simpleMaterial(color, roughness = 0.82, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

const wallTexture = makeTileTexture(5, 10, [211, 210, 203], "#96958f", 125, 2);
const floorTexture = makeTileTexture(2, 2, [102, 105, 104], "#454849", 317, 4);
const ceilingTexture = makeTileTexture(2, 2, [165, 165, 159], "#888983", 528, 3);

const wallMat = new THREE.MeshPhysicalMaterial({
  map: repeated(wallTexture, L, H),
  color: 0xc9c9c4,
  roughness: 0.34,
  metalness: 0.035,
  clearcoat: 0.32,
  clearcoatRoughness: 0.24,
  side: THREE.DoubleSide
});
const floorMat = new THREE.MeshPhysicalMaterial({
  map: repeated(floorTexture, W / 1.2, L / 1.2),
  roughness: 0.55,
  metalness: 0.025,
  clearcoat: 0.16,
  clearcoatRoughness: 0.38
});
const ceilingMat = new THREE.MeshStandardMaterial({
  map: repeated(ceilingTexture, W / 2.4, L / 1.2),
  roughness: 0.96,
  side: THREE.DoubleSide
});

const metalDark = simpleMaterial(0x363a3c, 0.65, 0.25);
const metal = simpleMaterial(0x777b7a, 0.5, 0.35);
const doorMat = simpleMaterial(0x777b79, 0.8);
const black = simpleMaterial(0x202325, 0.8);
const white = simpleMaterial(0xd8d7cf, 0.75);

// ==========================================
// 3. GEOMETRY HELPERS
// ==========================================
function addBox(width, height, depth, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    material
  );
  mesh.position.set(x, y, z);
  scene.add(mesh);
  return mesh;
}

function addPlane(width, height, material, x, y, z, rx = 0, ry = 0) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, height),
    material
  );
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, 0);
  mesh.receiveShadow = false;
  scene.add(mesh);
  return mesh;
}

// ==========================================
// 4. LIGHTING
// ==========================================
scene.add(new THREE.AmbientLight(0xcbd4df, 0.19));
scene.add(new THREE.HemisphereLight(0xb9c8d8, 0x17191c, 0.20));

const lampMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  emissive: 0xdccfb7,
  emissiveIntensity: 0.82,
  roughness: 0.4
});
const lampLights = [];

function addCeilingLight(z) {
  addBox(0.32, 0.07, 2.25, metalDark, 0, H - 0.045, z);
  addBox(0.27, 0.025, 2.15, metal, 0, H - 0.09, z);
  addBox(0.23, 0.018, 2.05, lampMaterial, 0, H - 0.11, z);

  const light = new THREE.PointLight(0xdce8ff, 0.68, 9, 2);
  light.position.set(0, H - 0.23, z);
  scene.add(light);
  lampLights.push(light);
}

for (let z = WORLD.start - 1; z > WORLD.end + 2; z -= 8) {
  addCeilingLight(z);
}

// ==========================================
// 5. CORRIDOR STRUCTURE
// ==========================================
addBox(W, 0.22, L, simpleMaterial(0x505354), 0, -0.11, Z);
addBox(W, 0.22, L, simpleMaterial(0x858680), 0, H + 0.11, Z);

addBox(0.22, H, L, simpleMaterial(0x55595b), -W / 2, H / 2, Z);
addBox(0.22, H, L, simpleMaterial(0x55595b), W / 2, H / 2, Z);
addBox(W, H, 0.22, simpleMaterial(0xaaa9a3), 0, H / 2, WORLD.end);

addPlane(W, L, floorMat, 0, 0.006, Z, -Math.PI / 2);
addPlane(W, L, ceilingMat, 0, H - 0.006, Z, Math.PI / 2);

const wallLeft = wallMat.clone();
const wallRight = wallMat.clone();
wallLeft.map = repeated(wallTexture, L, H);
wallRight.map = repeated(wallTexture, L, H);
addPlane(L, H, wallLeft, -W / 2 + 0.118, H / 2, Z, 0, Math.PI / 2);
addPlane(L, H, wallRight, W / 2 - 0.118, H / 2, Z, 0, -Math.PI / 2);

// Wall skirting and narrow upper trim.
for (const side of [-1, 1]) {
  addBox(0.035, 0.15, L, metalDark, side * (W / 2 - 0.15), 0.075, Z);
  addBox(0.025, 0.025, L, metal, side * (W / 2 - 0.145), 0.17, Z);
  addBox(0.025, 0.045, L, metal, side * (W / 2 - 0.15), H - 0.18, Z);
}

// Ceiling panel seams and maintenance panels.
for (let z = WORLD.start - 0.6; z > WORLD.end; z -= 1.2) {
  addBox(W - 0.16, 0.012, 0.014, simpleMaterial(0x777873), 0, H - 0.018, z);
}
for (const z of [8, -16]) {
  addBox(0.8, 0.025, 0.8, metalDark, 1.35, H - 0.02, z);
  addBox(0.7, 0.012, 0.7, simpleMaterial(0xaaa9a2), 1.35, H - 0.04, z);
}

// ==========================================
// 6. TACTILE PAVING
// ==========================================
function makeTactileTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 256;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#a98224";
  ctx.fillRect(0, 0, 256, 256);

  for (let i = 0; i < 4; i++) {
    const x = 28 + i * 66;
    const grad = ctx.createLinearGradient(x - 8, 0, x + 8, 0);
    grad.addColorStop(0, "#82651e");
    grad.addColorStop(0.35, "#d4b443");
    grad.addColorStop(0.7, "#c7a43a");
    grad.addColorStop(1, "#80651f");
    ctx.fillStyle = grad;
    ctx.fillRect(x - 8, 0, 16, 256);
  }
  ctx.fillStyle = "#795f20";
  for (let y = 0; y < 256; y += 128) ctx.fillRect(0, y, 256, 2);
  return makeCanvasTexture(canvas, true);
}
const tactileMaterial = new THREE.MeshStandardMaterial({
  map: repeated(makeTactileTexture(), 1, L),
  roughness: 0.95,
  side: THREE.DoubleSide
});
addPlane(0.42, L, tactileMaterial, 0, 0.018, Z, -Math.PI / 2);

// ==========================================
// 7. WALL EQUIPMENT
// ==========================================
function posterTexture(title, subtitle, headerColor) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 640;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#e9e5d9";
  ctx.fillRect(0, 0, 512, 640);
  ctx.fillStyle = headerColor;
  ctx.fillRect(0, 0, 512, 105);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 36px sans-serif";
  ctx.fillText(title, 28, 69);
  ctx.fillStyle = "#333";
  ctx.font = "bold 28px sans-serif";
  ctx.fillText(subtitle, 30, 160);
  ctx.fillStyle = "#c9ccc5";
  ctx.fillRect(32, 190, 448, 250);
  ctx.fillStyle = "#829087";
  ctx.fillRect(50, 208, 412, 214);
  ctx.fillStyle = "#e8e3d7";
  ctx.fillRect(120, 260, 275, 120);
  ctx.fillStyle = "#526b68";
  for (let i = 0; i < 5; i++) ctx.fillRect(140 + i * 48, 280, 23, 75);
  ctx.fillStyle = "#333";
  ctx.font = "bold 24px sans-serif";
  ctx.fillText("INFORMATION", 32, 500);
  ctx.font = "18px sans-serif";
  ctx.fillText("PLEASE CHECK THE NOTICE", 32, 540);
  ctx.fillText("THANK YOU FOR YOUR", 32, 575);
  ctx.fillText("COOPERATION.", 32, 605);
  return makeCanvasTexture(canvas, true);
}

function addPoster(side, z, title, subtitle, color) {
  const frameX = side * (W / 2 - 0.13);
  addBox(0.055, 1.2, 0.9, metalDark, frameX, 1.88, z);
  const poster = new THREE.Mesh(
    new THREE.PlaneGeometry(0.79, 1.08),
    new THREE.MeshBasicMaterial({
      map: posterTexture(title, subtitle, color),
      side: THREE.DoubleSide
    })
  );
  poster.position.set(side * (W / 2 - 0.17), 1.88, z);
  poster.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2;
  scene.add(poster);
}
addPoster(-1, 6.5, "INFORMATION", "施設のご案内", "#36576c");
addPoster(-1, 5.2, "GUIDE", "地下通路のご案内", "#536a5a");

function addServiceDoor(side, z) {
  const x = side * (W / 2 - 0.13);
  addBox(0.07, 2.12, 0.98, metalDark, x, 1.08, z);
  addBox(0.045, 1.98, 0.84, doorMat, x - side * 0.045, 1.05, z);
  addBox(0.025, 1.68, 0.65, simpleMaterial(0x858987), x - side * 0.075, 1.05, z);
  addBox(0.025, 0.22, 0.12, metalDark, x - side * 0.09, 1.08, z - 0.29);
  addBox(0.03, 0.12, 0.045, black, x - side * 0.11, 1.08, z - 0.29);
  addBox(0.025, 0.14, 0.34, white, x - side * 0.09, 1.9, z);
}
addServiceDoor(1, -8);
addServiceDoor(-1, -19);

function addEmergencyCabinet(side, z) {
  const x = side * (W / 2 - 0.13);
  addBox(0.13, 0.36, 0.43, simpleMaterial(0x963d35), x, 1.42, z);
  addBox(0.025, 0.22, 0.28, white, x - side * 0.08, 1.42, z);
  addBox(0.02, 0.06, 0.14, simpleMaterial(0x2f7948), x - side * 0.10, 1.42, z);
}
addEmergencyCabinet(-1, -12);

function addVent(side, z) {
  const x = side * (W / 2 - 0.13);
  const y = 2.88;
  addBox(0.055, 0.46, 0.78, metalDark, x, y, z);
  for (let i = 0; i < 7; i++) {
    addBox(0.025, 0.025, 0.66, metal, x - side * 0.04, y - 0.18 + i * 0.06, z);
  }
}
addVent(-1, -22);
addVent(1, 3);

// ==========================================
// 8. EXIT SIGN AND FAR END
// ==========================================
function makeSignTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 160;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#176b43";
  ctx.fillRect(0, 0, 512, 160);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.font = "bold 65px sans-serif";
  ctx.fillText("EXIT  →", 256, 75);
  ctx.font = "26px sans-serif";
  ctx.fillText("出口案内", 256, 125);
  return makeCanvasTexture(canvas, true);
}
addBox(1.55, 0.5, 0.08, metalDark, 0, 3.02, -22.7);
const exitSign = new THREE.Mesh(
  new THREE.PlaneGeometry(1.43, 0.42),
  new THREE.MeshBasicMaterial({ map: makeSignTexture(), side: THREE.DoubleSide })
);
exitSign.position.set(0, 3.02, -22.65);
scene.add(exitSign);

addBox(W, H, 0.22, simpleMaterial(0xaaa9a3), 0, H / 2, WORLD.end);
addBox(W, 0.12, 0.12, metalDark, 0, 0.07, WORLD.end + 0.02);

// ==========================================
// 9. PROCEDURAL AUDIO
// ==========================================
let audioContext = null;
let audioMaster = null;
let noiseBuffer = null;

function createNoiseBuffer(ctx) {
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let filtered = 0;
  for (let i = 0; i < data.length; i++) {
    filtered = filtered * 0.88 + (Math.random() * 2 - 1) * 0.12;
    data[i] = filtered * 3;
  }
  return buffer;
}

function initAudio() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  if (!audioContext) {
    audioContext = new AudioContextClass();
    const ctx = audioContext;
    audioMaster = ctx.createGain();
    audioMaster.gain.value = 0.5;
    audioMaster.connect(ctx.destination);
    noiseBuffer = createNoiseBuffer(ctx);

    // Soft ventilation rumble.
    const air = ctx.createBufferSource();
    air.buffer = noiseBuffer;
    air.loop = true;
    const airFilter = ctx.createBiquadFilter();
    airFilter.type = "lowpass";
    airFilter.frequency.value = 650;
    const airGain = ctx.createGain();
    airGain.gain.value = 0.045;
    air.connect(airFilter);
    airFilter.connect(airGain);
    airGain.connect(audioMaster);
    air.start();

    // Distant train-like low rumble.
    const train = ctx.createBufferSource();
    train.buffer = noiseBuffer;
    train.loop = true;
    const trainFilter = ctx.createBiquadFilter();
    trainFilter.type = "lowpass";
    trainFilter.frequency.value = 190;
    const trainGain = ctx.createGain();
    trainGain.gain.value = 0.012;
    train.connect(trainFilter);
    trainFilter.connect(trainGain);
    trainGain.connect(audioMaster);
    train.start();

    const swell = ctx.createOscillator();
    const swellDepth = ctx.createGain();
    swell.frequency.value = 0.035;
    swellDepth.gain.value = 0.009;
    swell.connect(swellDepth);
    swellDepth.connect(trainGain.gain);
    swell.start();

    const hum = ctx.createOscillator();
    const humGain = ctx.createGain();
    hum.type = "sine";
    hum.frequency.value = 58;
    humGain.gain.value = 0.018;
    hum.connect(humGain);
    humGain.connect(audioMaster);
    hum.start();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume().catch(() => {});
  }
}

function playFootstep(running) {
  if (!audioContext || audioContext.state !== "running") return;
  const ctx = audioContext;
  const now = ctx.currentTime;

  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;
  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = running ? 950 : 720;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.0001, now);
  noiseGain.gain.exponentialRampToValueAtTime(running ? 0.14 : 0.105, now + 0.006);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
  noise.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(audioMaster);
  noise.start(now, Math.random() * 2.5, 0.14);

  const thump = ctx.createOscillator();
  const thumpGain = ctx.createGain();
  thump.type = "sine";
  thump.frequency.setValueAtTime(running ? 88 : 72, now);
  thump.frequency.exponentialRampToValueAtTime(42, now + 0.07);
  thumpGain.gain.setValueAtTime(0.0001, now);
  thumpGain.gain.exponentialRampToValueAtTime(running ? 0.055 : 0.04, now + 0.004);
  thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
  thump.connect(thumpGain);
  thumpGain.connect(audioMaster);
  thump.start(now);
  thump.stop(now + 0.1);
}

// ==========================================
// 10. PLAYER INPUT AND POINTER LOCK
// ==========================================
let yaw = 0;
let pitch = 0;
let started = false;
const keys = {};
const playerSpeed = 3.5;
const playerRadius = 0.34;
const movementKeys = [
  "KeyW", "KeyA", "KeyS", "KeyD", "ShiftLeft", "ShiftRight"
];

function clearKeys() {
  movementKeys.forEach(key => { keys[key] = false; });
}

function startGame() {
  initAudio();
  if (document.pointerLockElement === renderer.domElement) return;
  try {
    const result = renderer.domElement.requestPointerLock();
    if (result && result.catch) {
      result.catch(error => {
        console.log(error);
        description.textContent = "マウスロックに失敗しました。Enterでもう一度試してください。";
      });
    }
  } catch (error) {
    console.log(error);
    description.textContent = "マウスロックを開始できませんでした。";
  }
}

document.addEventListener("keydown", event => {
  if (event.code === "Enter") {
    event.preventDefault();
    if (!event.repeat) startGame();
    return;
  }
  if (movementKeys.includes(event.code)) {
    event.preventDefault();
    keys[event.code] = true;
  }
});

document.addEventListener("keyup", event => {
  keys[event.code] = false;
});
window.addEventListener("blur", clearKeys);

document.addEventListener("pointerlockchange", () => {
  started = document.pointerLockElement === renderer.domElement;
  overlay.style.display = started ? "none" : "flex";
  crosshair.style.display = started ? "block" : "none";
  clearKeys();

  if (audioMaster && audioContext) {
    const now = audioContext.currentTime;
    audioMaster.gain.cancelScheduledValues(now);
    audioMaster.gain.setTargetAtTime(started ? 0.5 : 0.0, now, 0.15);
  }

  if (!started) {
    description.textContent = "一時停止中。Enterで再開できます。";
    enterText.textContent = "PRESS ENTER TO RESUME";
  }
});

document.addEventListener("pointerlockerror", () => {
  description.textContent = "マウスロックに失敗しました。Enterでもう一度試してください。";
});

document.addEventListener("mousemove", event => {
  if (!started) return;
  yaw -= event.movementX * 0.002;
  pitch -= event.movementY * 0.002;
  pitch = Math.max(-1.35, Math.min(1.35, pitch));
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
});

// ==========================================
// 11. COLLISION AND MOVEMENT
// ==========================================
const clock = new THREE.Clock();
let walkingTime = 0;
let footstepTimer = 0;
const baseCameraHeight = 1.62;
const innerWallX = W / 2 - 0.11;
const safeMinX = -innerWallX + playerRadius;
const safeMaxX = innerWallX - playerRadius;
const safeMinZ = WORLD.end + 0.11 + playerRadius;
const safeMaxZ = WORLD.start - 0.11 - playerRadius;

function canMove(x, z) {
  return x >= safeMinX && x <= safeMaxX &&
         z >= safeMinZ && z <= safeMaxZ;
}

function updateMovement(delta) {
  let forward = 0;
  let sideways = 0;
  if (keys["KeyW"]) forward++;
  if (keys["KeyS"]) forward--;
  if (keys["KeyD"]) sideways++;
  if (keys["KeyA"]) sideways--;

  const inputLength = Math.hypot(forward, sideways);
  if (inputLength > 0) {
    forward /= inputLength;
    sideways /= inputLength;
  }

  const running = Boolean(keys["ShiftLeft"] || keys["ShiftRight"]);
  const speed = playerSpeed * (running ? 1.7 : 1);
  const totalStep = speed * delta;
  const dx = -Math.sin(yaw) * forward * totalStep +
              Math.cos(yaw) * sideways * totalStep;
  const dz = -Math.cos(yaw) * forward * totalStep -
              Math.sin(yaw) * sideways * totalStep;

  const oldX = camera.position.x;
  const oldZ = camera.position.z;
  const distance = Math.hypot(dx, dz);
  const steps = Math.max(1, Math.ceil(distance / 0.045));
  const stepX = dx / steps;
  const stepZ = dz / steps;

  for (let i = 0; i < steps; i++) {
    const tryX = camera.position.x + stepX;
    if (canMove(tryX, camera.position.z)) camera.position.x = tryX;

    const tryZ = camera.position.z + stepZ;
    if (canMove(camera.position.x, tryZ)) camera.position.z = tryZ;
  }

  camera.position.x = THREE.MathUtils.clamp(camera.position.x, safeMinX, safeMaxX);
  camera.position.z = THREE.MathUtils.clamp(camera.position.z, safeMinZ, safeMaxZ);

  const moved = Math.hypot(camera.position.x - oldX, camera.position.z - oldZ) > 0.001;
  if (moved) {
    footstepTimer += delta;
    const interval = running ? 0.34 : 0.52;
    if (footstepTimer >= interval) {
      footstepTimer %= interval;
      playFootstep(running);
    }
    walkingTime += delta * (running ? 12.5 : 8.5);
    camera.position.y = baseCameraHeight +
      Math.sin(walkingTime) * (running ? 0.028 : 0.014);
  } else {
    footstepTimer = 0;
    camera.position.y = THREE.MathUtils.lerp(
      camera.position.y, baseCameraHeight, Math.min(1, delta * 10)
    );
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

// ==========================================
// 12. ANIMATION AND RESIZE
// ==========================================
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  if (started) updateMovement(delta);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
});

})();
</script>
</body>
</html>
