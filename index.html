
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNDERGROUND</title>
<style>
* { box-sizing: border-box; }
html, body {

  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #17191c;
  color: white;
  font-family: Arial, sans-serif;
}
#game { position: fixed; inset: 0; }

#hud {

  z-index: 2;
  font-size: 14px;

}
#crosshair {

  z-index: 3;

}

  border: 1px solid #ffffff55;

}
@keyframes pulse {

}
#error {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  align-items: center;
  justify-content: center;
  background: #17191c;
  padding: 25px;
  text-align: center;
  color: #ffaaaa;
}
</style>
</head>
<body>

<div id="game"></div>

<div id="hud">
  UNDERGROUND<br>
  WASD : MOVE<br>
  SHIFT : RUN
</div>

<div id="crosshair"></div>

<div id="overlay">
  <div id="panel">
    <h1>UNDERGROUND</h1>
    <p>
      地下鉄の通路を進もう。<br>
      周囲を観察しながら進んでください。
    </p>
    <p>
      W : 前進<br>
      S : 後退<br>
      A / D : 左右移動<br>
      SHIFT : 走る<br>
      MOUSE : 視点移動
    </p>
    <div id="enterText">PRESS ENTER</div>
  </div>
</div>

<div id="error"><div id="errorText"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
"use strict";

// ==========================================
// 1. 基本設定
// ==========================================

const container = document.getElementById("game");
const overlay = document.getElementById("overlay");
const crosshair = document.getElementById("crosshair");
const errorScreen = document.getElementById("error");
const errorText = document.getElementById("errorText");

if (typeof THREE === "undefined") {
  errorScreen.style.display = "flex";
  errorText.textContent = "THREE.JS LOAD ERROR";
  return;
}

// 単位：メートル
const WORLD = {
  width: 4.8,
  height: 3.2,
  start: 16,
  end: -24
};

WORLD.length = WORLD.start - WORLD.end;
WORLD.center = (WORLD.start + WORLD.end) / 2;

const W = WORLD.width;
const H = WORLD.height;
const L = WORLD.length;
const Z = WORLD.center;

// ==========================================
// 2. シーン・カメラ
// ==========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x292c30);
scene.fog = new THREE.Fog(0x292c30, 10, 38);

const camera = new THREE.PerspectiveCamera(
  72,
  window.innerWidth / window.innerHeight,
  0.08,
  80
);

const BASE_HEIGHT = 1.62;

camera.position.set(0, BASE_HEIGHT, 12);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled = false;

container.appendChild(renderer.domElement);

// ==========================================
// 3. マテリアル・テクスチャ
// ==========================================

function makeTexture(cols, rows, base, grout, seed, gap) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 512;

  const ctx = canvas.getContext("2d");

  let state = seed >>> 0;

  function random() {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  }

  ctx.fillStyle = grout;
  ctx.fillRect(0, 0, 512, 512);

  const cw = 512 / cols;
  const ch = 512 / rows;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const variation = Math.floor(random() * 9 - 4);

      const r = Math.max(0, Math.min(255, base[0] + variation));
      const g = Math.max(0, Math.min(255, base[1] + variation));
      const b = Math.max(0, Math.min(255, base[2] + variation));

      const px = x * cw;
      const py = y * ch;

      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(
        px + gap,
        py + gap,
        cw - gap * 2,
        ch - gap * 2
      );

      const shine = ctx.createLinearGradient(
        px, py, px + cw, py + ch
      );

      shine.addColorStop(0, "#ffffff20");
      shine.addColorStop(0.5, "#ffffff00");
      shine.addColorStop(1, "#00000012");

      ctx.fillStyle = shine;
      ctx.fillRect(
        px + gap,
        py + gap,
        cw - gap * 2,
        ch - gap * 2
      );
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = Math.min(
    8,
    renderer.capabilities.getMaxAnisotropy()
  );
  texture.encoding = THREE.sRGBEncoding;

  return texture;
}

function repeatTexture(texture, x, y) {
  const copy = texture.clone();
  copy.wrapS = THREE.RepeatWrapping;
  copy.wrapT = THREE.RepeatWrapping;
  copy.repeat.set(x, y);
  copy.needsUpdate = true;
  return copy;
}

const wallTexture = makeTexture(
  12, 12, [139, 140, 137], "#686a68", 456, 3
);

const floorTexture = makeTexture(
  4, 4, [139, 140, 137], "#686a68", 456, 3
);

const ceilingTexture = makeTexture(
  2, 2, [139, 140, 136], "#777975", 789, 3
);

const wallMaterial = new THREE.MeshPhysicalMaterial({
  map: repeatTexture(wallTexture, L / 0.6, H / 0.6),
  color: 0xffffff,
  roughness: 0.58,
  metalness: 0.015,
  clearcoat: 0.16,
  clearcoatRoughness: 0.4
});

const floorMaterial = new THREE.MeshPhysicalMaterial({
  map: repeatTexture(floorTexture, W / 0.6, L / 0.6),
  roughness: 0.58,
  metalness: 0.015,
  clearcoat: 0.16,
  clearcoatRoughness: 0.4
});

const ceilingMaterial = new THREE.MeshStandardMaterial({
  map: repeatTexture(ceilingTexture, W / 1.2, L / 1.2),

});

const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x45494a,

});

const lightMetal = new THREE.MeshStandardMaterial({
  color: 0x858986,
  roughness: 0.5,
  metalness: 0.25
});

const whiteMaterial = new THREE.MeshStandardMaterial({
  color: 0xd2d1c9,
  roughness: 0.8
});

// ==========================================
// 4. ジオメトリ補助
// ==========================================

function box(w, h, d, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material
  );

  mesh.position.set(x, y, z);
  scene.add(mesh);
  return mesh;
}

function plane(w, h, material, x, y, z, rx, ry) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    material
  );

  mesh.position.set(x, y, z);
  mesh.rotation.set(rx || 0, ry || 0, 0);
  scene.add(mesh);
  return mesh;
}

// ==========================================
// 5. 照明
// ==========================================

scene.add(new THREE.AmbientLight(0xc8d2df, 0.24));

scene.add(
  new THREE.HemisphereLight(
    0xb9c6d4,
    0x222326,
    0.23
  )
);

const lampMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  emissive: 0xe1dfd5,
  emissiveIntensity: 1.1,
  roughness: 0.5
});

function addLamp(z) {

    darkMetal, 0, H - 0.035, z
  );

  box(
    0.26, 0.025, 1.88,
    lampMaterial, 0, H - 0.075, z
  );

  const light = new THREE.PointLight(
    0xdde8ff, 0.75, 9, 2
  );

  light.position.set(0, H - 0.2, z);
  scene.add(light);
}

for (

  z > WORLD.end + 1;

// ==========================================
// 6. 床・壁・天井
// ==========================================

// 床
box(
  W, 0.2, L,
  new THREE.MeshStandardMaterial({
    color: 0x777977,
    roughness: 0.9
  }),
  0, -0.1, Z
);

plane(
  0.55, L,
  tactileMaterial,
  -0.25, 0.025, Z,
  -Math.PI / 2
);

// 天井
box(
  W, 0.2, L,
  new THREE.MeshStandardMaterial({
    color: 0x777975,
    roughness: 0.95
  }),
  0, H + 0.1, Z
);

plane(
  W, L,
  ceilingMaterial,
  0, H - 0.012, Z,
  Math.PI / 2
);

// 壁本体
const WALL_THICKNESS = 0.18;
const WALL_CENTER = W / 2 - WALL_THICKNESS / 2;
const WALL_FACE = W / 2 - WALL_THICKNESS;

// 壁は箱で作り、内側のタイル面を少し通路側へ出す。
// 壁本体とタイル面を重ねすぎないようにする。
box(
  WALL_THICKNESS, H, L,
  darkMetal,
  -WALL_CENTER, H / 2, Z
);

box(
  WALL_THICKNESS, H, L,
  darkMetal,
  WALL_CENTER, H / 2, Z
);

const leftWallMat = wallMaterial.clone();
leftWallMat.map = repeatTexture(wallTexture, L / 0.6, H / 0.6);

const rightWallMat = wallMaterial.clone();
rightWallMat.map = repeatTexture(wallTexture, L / 0.6, H / 0.6);

// 左右のタイル面は壁本体の内側に配置。
plane(
  L, H,
  leftWallMat,
  -WALL_FACE + 0.012,
  H / 2,
  Z,
  0, Math.PI / 2
);

plane(
  L, H,
  rightWallMat,
  WALL_FACE - 0.012,
  H / 2,
  Z,
  0, -Math.PI / 2
);

// 壁の端の見切り
for (const side of [-1, 1]) {
  box(
    0.035, 0.14, L,
    darkMetal,
    side * (WALL_FACE - 0.04),
    0.07,
    Z
  );

  box(
    0.025, 0.035, L,
    lightMetal,
    side * (WALL_FACE - 0.04),
    H - 0.12,
    Z
  );
}

// 奥の壁
box(
  W, H, 0.2,
  darkMetal,
  0, H / 2, WORLD.end
);

plane(
  W, H,
  wallMaterial,
  0, H / 2, WORLD.end + 0.105,
  0, 0
);

// ==========================================
// 7. 天井パネル
// ==========================================

const seamMaterial = new THREE.MeshStandardMaterial({
  color: 0x656864,
  roughness: 0.9
});

for (
  let z = WORLD.start - 0.6;
  z > WORLD.end;
  z -= 0.8
) {
  box(
    W - 0.08, 0.012, 0.012,
    seamMaterial,
    0, H - 0.025, z
  );
}

// ==========================================
// 8. 点字ブロック
// ==========================================

const tactileCanvas = document.createElement("canvas");
tactileCanvas.width = 256;
tactileCanvas.height = 256;

const tactileCtx = tactileCanvas.getContext("2d");

tactileCtx.fillStyle = "#b18b31";
tactileCtx.fillRect(0, 0, 256, 256);

for (let i = 0; i < 4; i++) {
  const x = 32 + i * 64;

  const gradient = tactileCtx.createLinearGradient(
    x - 8, 0, x + 8, 0
  );

  gradient.addColorStop(0, "#80601f");
  gradient.addColorStop(0.4, "#d1ad43");
  gradient.addColorStop(1, "#896a25");

  tactileCtx.fillStyle = gradient;
  tactileCtx.fillRect(x - 8, 0, 16, 256);
}

const tactileTexture = new THREE.CanvasTexture(tactileCanvas);
tactileTexture.wrapS = THREE.RepeatWrapping;
tactileTexture.wrapT = THREE.RepeatWrapping;
tactileTexture.encoding = THREE.sRGBEncoding;
tactileTexture.repeat.set(1, L / 0.3);

const tactileMaterial = new THREE.MeshStandardMaterial({
  map: tactileTexture,
  roughness: 0.9
});

plane(
  0.55, L,
  tactileMaterial,
  0, 0.025, Z,
  -Math.PI / 2
);

// ==========================================
// 9. ポスター
// ==========================================

function createPosterTexture(title, subtitle, color) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 640;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#e6e3d9";
  ctx.fillRect(0, 0, 512, 640);

  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 512, 100);

  ctx.fillStyle = "white";
  ctx.font = "bold 35px sans-serif";
  ctx.fillText(title, 24, 65);

  ctx.fillStyle = "#333";
  ctx.font = "bold 28px sans-serif";
  ctx.fillText(subtitle, 28, 155);

  ctx.fillStyle = "#bfc5c0";
  ctx.fillRect(30, 190, 452, 235);

  ctx.fillStyle = "#687e7a";
  ctx.fillRect(52, 210, 408, 195);

  ctx.fillStyle = "#e6e0d1";
  ctx.fillRect(105, 260, 300, 100);

  ctx.fillStyle = "#333";
  ctx.font = "bold 23px sans-serif";
  ctx.fillText("INFORMATION", 30, 485);

  ctx.font = "18px sans-serif";
  ctx.fillText("PLEASE CHECK THE NOTICE", 30, 530);
  ctx.fillText("THANK YOU FOR YOUR", 30, 565);
  ctx.fillText("COOPERATION.", 30, 595);

  const texture = new THREE.CanvasTexture(canvas);
  texture.encoding = THREE.sRGBEncoding;
  return texture;
}

function addPoster(side, z, title, subtitle, color) {
  const x = side * (WALL_FACE - 0.045);

    darkMetal,

  );

  const poster = new THREE.Mesh(
    new THREE.PlaneGeometry(0.65, 0.98),
    new THREE.MeshBasicMaterial({
      map: createPosterTexture(title, subtitle, color),
      side: THREE.DoubleSide
    })
  );

  poster.position.set(
    side * (WALL_FACE - 0.075),
    1.8,
    z
  );

  poster.rotation.y = side < 0
    ? Math.PI / 2
    : -Math.PI / 2;

  scene.add(poster);
}

addPoster(-1, 7, "INFORMATION", "施設のご案内", "#326b85");
addPoster(-1, 5.8, "GUIDE", "地下通路のご案内", "#b38b3d");

// ==========================================

function addDoor(side, z) {

  );

  );

}

addDoor(1, -10);
addDoor(-1, -17);

  const x = side * (WALL_FACE - 0.04);

// ==========================================
// 11. 案内板
// ==========================================

const signCanvas = document.createElement("canvas");
signCanvas.width = 512;

box(

// ==========================================
// 12. 音声
// ==========================================

let audioContext = null;
let audioMaster = null;
let noiseBuffer = null;

function createNoise(ctx) {
  const buffer = ctx.createBuffer(
    1,
    ctx.sampleRate * 4,
    ctx.sampleRate
  );

  const data = buffer.getChannelData(0);
  let smooth = 0;

  for (let i = 0; i < data.length; i++) {
    smooth = smooth * 0.88 +
      (Math.random() * 2 - 1) * 0.12;

    data[i] = smooth * 3;
  }

  return buffer;
}

function initAudio() {
  const AudioClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioClass) return;

  if (!audioContext) {
    audioContext = new AudioClass();

    const ctx = audioContext;

    audioMaster = ctx.createGain();
    audioMaster.gain.value = 0.5;
    audioMaster.connect(ctx.destination);

    noiseBuffer = createNoise(ctx);

    // 空調音
    const air = ctx.createBufferSource();
    air.buffer = noiseBuffer;
    air.loop = true;

    const airFilter = ctx.createBiquadFilter();
    airFilter.type = "lowpass";
    airFilter.frequency.value = 700;

    const airGain = ctx.createGain();
    airGain.gain.value = 0.04;

    air.connect(airFilter);
    airFilter.connect(airGain);
    airGain.connect(audioMaster);
    air.start();

    // 遠くの電車のような音
    const train = ctx.createBufferSource();
    train.buffer = noiseBuffer;
    train.loop = true;

    const trainFilter = ctx.createBiquadFilter();
    trainFilter.type = "lowpass";
    trainFilter.frequency.value = 180;

    const trainGain = ctx.createGain();
    trainGain.gain.value = 0.014;

    train.connect(trainFilter);
    trainFilter.connect(trainGain);
    trainGain.connect(audioMaster);
    train.start();

    // 低い機械音
    const hum = ctx.createOscillator();
    const humGain = ctx.createGain();

    hum.type = "sine";
    hum.frequency.value = 58;
    humGain.gain.value = 0.018;

    hum.connect(humGain);
    humGain.connect(audioMaster);
    hum.start();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume().catch(() => {});
  }
}

function playFootstep(running) {
  if (!audioContext || audioContext.state !== "running") return;

  const ctx = audioContext;
  const now = ctx.currentTime;

  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;

  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = running ? 900 : 650;

  const gain = ctx.createGain();

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(
    running ? 0.14 : 0.1,
    now + 0.006
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.13
  );

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioMaster);

  noise.start(now, Math.random() * 2.5, 0.14);

  const thump = ctx.createOscillator();
  const thumpGain = ctx.createGain();

  thump.type = "sine";
  thump.frequency.setValueAtTime(
    running ? 85 : 70,
    now
  );

  thump.frequency.exponentialRampToValueAtTime(
    40,
    now + 0.07
  );

  thumpGain.gain.setValueAtTime(0.0001, now);
  thumpGain.gain.exponentialRampToValueAtTime(
    running ? 0.055 : 0.04,
    now + 0.004
  );
  thumpGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.09
  );

  thump.connect(thumpGain);
  thumpGain.connect(audioMaster);

  thump.start(now);
  thump.stop(now + 0.1);
}

// ==========================================
// 13. 操作
// ==========================================

let yaw = 0;
let pitch = 0;
let started = false;

const keys = {};

const movementKeys = [
  "KeyW", "KeyA", "KeyS", "KeyD",
  "ShiftLeft", "ShiftRight"
];

function clearKeys() {
  for (const key of movementKeys) {
    keys[key] = false;
  }
}

function startGame() {
  initAudio();

  if (document.pointerLockElement === renderer.domElement) {
    return;
  }

  try {
    const result =
      renderer.domElement.requestPointerLock();

    if (result && result.catch) {
      result.catch(error => console.log(error));
    }
  } catch (error) {
    console.log(error);
  }
}

document.addEventListener("keydown", event => {
  if (event.code === "Enter") {
    event.preventDefault();

    if (!event.repeat) {
      startGame();
    }
    return;
  }

  if (movementKeys.includes(event.code)) {
    event.preventDefault();
    keys[event.code] = true;
  }
});

document.addEventListener("keyup", event => {
  keys[event.code] = false;
});

window.addEventListener("blur", clearKeys);

document.addEventListener("pointerlockchange", () => {
  started =
    document.pointerLockElement === renderer.domElement;

  overlay.style.display = started ? "none" : "flex";
  crosshair.style.display = started ? "block" : "none";

  clearKeys();

  if (audioMaster && audioContext) {
    const now = audioContext.currentTime;

    audioMaster.gain.cancelScheduledValues(now);
    audioMaster.gain.setTargetAtTime(
      started ? 0.5 : 0,
      now,
      0.15
    );
  }

  if (!started) {
    document.getElementById("enterText").textContent =
      "PRESS ENTER TO RESUME";
  }
});

document.addEventListener("mousemove", event => {
  if (!started) return;

  yaw -= event.movementX * 0.002;
  pitch -= event.movementY * 0.002;

  pitch = Math.max(
    -1.35,
    Math.min(1.35, pitch)
  );

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
});

// ==========================================
// 14. 衝突判定・移動
// ==========================================

const clock = new THREE.Clock();

const PLAYER_RADIUS = 0.32;
const MOVE_SPEED = 3.5;

const INNER_WALL = WALL_FACE - 0.012;

const MIN_X = -INNER_WALL + PLAYER_RADIUS;
const MAX_X = INNER_WALL - PLAYER_RADIUS;

const MIN_Z = WORLD.end + 0.22 + PLAYER_RADIUS;
const MAX_Z = WORLD.start - 0.22 - PLAYER_RADIUS;

let walkingTime = 0;
let footstepTimer = 0;

function canMove(x, z) {
  return (
    x >= MIN_X &&
    x <= MAX_X &&
    z >= MIN_Z &&
    z <= MAX_Z
  );
}

function updateMovement(delta) {
  let forward = 0;
  let sideways = 0;

  if (keys["KeyW"]) forward++;
  if (keys["KeyS"]) forward--;

  if (keys["KeyD"]) sideways++;
  if (keys["KeyA"]) sideways--;

  const len = Math.hypot(forward, sideways);

  if (len > 0) {
    forward /= len;
    sideways /= len;
  }

  const running =
    keys["ShiftLeft"] || keys["ShiftRight"];

  const speed = MOVE_SPEED * (running ? 1.7 : 1);
  const distance = speed * delta;

  const dx =
    -Math.sin(yaw) * forward * distance +
    Math.cos(yaw) * sideways * distance;

  const dz =
    -Math.cos(yaw) * forward * distance -
    Math.sin(yaw) * sideways * distance;

  const oldX = camera.position.x;
  const oldZ = camera.position.z;

  // 小刻みに移動して壁へのめり込みを防止
  const steps = Math.max(
    1,
    Math.ceil(Math.hypot(dx, dz) / 0.04)
  );

  for (let i = 0; i < steps; i++) {
    const sx = dx / steps;
    const sz = dz / steps;

    const nextX = camera.position.x + sx;

    if (canMove(nextX, camera.position.z)) {
      camera.position.x = nextX;
    }

    const nextZ = camera.position.z + sz;

    if (canMove(camera.position.x, nextZ)) {
      camera.position.z = nextZ;
    }
  }

  camera.position.x = THREE.MathUtils.clamp(
    camera.position.x, MIN_X, MAX_X
  );

  camera.position.z = THREE.MathUtils.clamp(
    camera.position.z, MIN_Z, MAX_Z
  );

  const moved =
    Math.hypot(
      camera.position.x - oldX,
      camera.position.z - oldZ
    ) > 0.001;

  if (moved) {
    footstepTimer += delta;

    const interval = running ? 0.34 : 0.52;

    if (footstepTimer >= interval) {
      footstepTimer %= interval;
      playFootstep(running);
    }

    walkingTime += delta * (running ? 12 : 8.5);

    camera.position.y =
      BASE_HEIGHT +
      Math.sin(walkingTime) *
      (running ? 0.025 : 0.012);

  } else {
    footstepTimer = 0;

    camera.position.y = THREE.MathUtils.lerp(
      camera.position.y,
      BASE_HEIGHT,
      Math.min(1, delta * 10)
    );
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

// ==========================================
// 15. 描画・画面サイズ
// ==========================================

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  if (started) {
    updateMovement(delta);
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 1.5)
  );
});

})();
</script>
</body>
</html>
